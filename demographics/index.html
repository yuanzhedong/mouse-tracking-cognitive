<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobre você</title>
<style>
  :root { --bg:#f4efe4; --panel:#ece5d3; --ink:#1f1e2c; --soft:#7a7587; --accent:#a8324a; --rule:#d8cfb6; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  .container { max-width: 800px; margin: 0 auto; padding: 32px 20px 60px; }
  header { padding-bottom: 10px; margin-bottom: 22px; border-bottom: 1px solid var(--ink); }
  header h1 { font-size: 20px; font-weight: 600; }

  .card { background: var(--panel); border: 1px solid var(--ink); padding: clamp(24px, 4vw, 44px) clamp(22px, 4.5vw, 52px); }
  .card h2 { font-size: clamp(22px, 2.8vw, 32px); margin-bottom: 24px; }
  .field { margin-bottom: 22px; }
  .field label { display: block; font-size: clamp(18px, 2.2vw, 23px); font-weight: 600; margin-bottom: 8px; }
  .field input, .field select {
    width: 100%; max-width: 300px; padding: 14px 16px; font-size: 22px; font-family: inherit;
    border: 1px solid var(--ink); background: var(--bg); color: var(--ink); border-radius: 0;
  }
  .field.missing input, .field.missing select { border-color: var(--accent); outline: 2px solid var(--accent); }

  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
  .nav .err { color: var(--accent); font-size: 17px; flex: 1; }
  .nav button { padding: 14px 44px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-family: inherit; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; }
  .nav button:disabled { opacity: 0.5; cursor: default; }
</style>
<link rel="stylesheet" href="../shared/touch.css?v=202611091438">
</head>
<body>
<div class="container">
  <header><h1 data-i18n="app_title"></h1></header>

  <div class="card">
    <h2 data-i18n="demo_title"></h2>
    <div class="field" id="gradeField">
      <label for="grade" data-i18n="demo_grade"></label>
      <input type="text" id="grade" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" data-i18n-placeholder="demo_grade_ph">
    </div>
    <div class="field" id="ageField">
      <label for="age" data-i18n="demo_age"></label>
      <select id="age"></select>
    </div>
    <div class="nav">
      <div class="err" id="err"></div>
      <button id="nextBtn" data-i18n="next"></button>
    </div>
  </div>
</div>

<script src="../shared/config.js?v=202611091438"></script>
<script src="../shared/i18n.js?v=202611091438"></script>
<script src="../shared/session.js?v=202611091438"></script>
<script>
/* Grade (school year, a number) and age (from a list), after the assent
   page. Saved to the `demographics` table. */
const $ = id => document.getElementById(id);
Session.applyI18n();
document.title = Session.t('demo_title');
const shownAt = performance.now();

// age list: "10 or younger", 11 … 18, "19 or older"
const AGES = [['<=10', Session.t('demo_age_min')], ...Array.from({ length: 8 }, (_, i) => [String(11 + i), String(11 + i)]), ['>=19', Session.t('demo_age_max')]];
$('age').innerHTML = `<option value="" selected disabled>${Session.t('demo_age_choose')}</option>` +
  AGES.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');

// numbers only
$('grade').addEventListener('input', () => { $('grade').value = $('grade').value.replace(/\D/g, ''); $('gradeField').classList.remove('missing'); });
$('age').addEventListener('change', () => $('ageField').classList.remove('missing'));

$('nextBtn').addEventListener('click', async () => {
  const grade = $('grade').value;
  const age = $('age').value;
  const gradeOk = /^\d{1,2}$/.test(grade) && +grade >= 1 && +grade <= 12;
  $('gradeField').classList.toggle('missing', !gradeOk);
  $('ageField').classList.toggle('missing', !age);
  if (!gradeOk || !age){ $('err').textContent = Session.t(grade && !gradeOk ? 'demo_grade_invalid' : 'please_answer_all'); return; }
  $('nextBtn').disabled = true;
  await Session.save({ demographics: [{ grade: +grade, age, rt_ms: Math.round(performance.now() - shownAt) }],
                       task_status: [{ task: 'demographics', completion_status: 'completed' }] }, 'demographics');
  Session.next('demographics');
});

Session.status('demographics', 'not_completed');
</script>
</body>
</html>
