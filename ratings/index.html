<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- iPad: "Add to Home Screen" opens the site full screen, without the browser bars -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sessão">

<title>Ratings</title>
<link rel="stylesheet" href="../shared/activity.css?v=202611112050">
<style>
  :root { --bg:#f4efe4; --panel:#ece5d3; --ink:#1f1e2c; --soft:#7a7587; --accent:#a8324a; --rule:#d8cfb6; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  .container { max-width: 1100px; margin: 0 auto; padding: clamp(10px, 3.5vh, 32px) 20px; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--ink); }
  header h1 { font-size: 16px; font-weight: 600; }
  header .step { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--soft); }
  .bar { height: 3px; background: var(--rule); margin-bottom: 24px; }
  .bar div { height: 100%; background: var(--accent); transition: width 0.2s; }

  .intro, .card { background: var(--panel); border: 1px solid var(--ink); padding: 28px 32px; }
  .intro { padding: clamp(14px, min(4vw, 4.5vh), 44px) clamp(20px, 4.5vw, 52px); }
  .intro h2 { font-size: clamp(19px, min(2.8vw, 4.2vh), 32px); margin-bottom: 18px; }
  .intro p { font-size: clamp(15px, min(2.1vw, 2.9vh), 23px); line-height: 1.55; margin-bottom: 14px; }
  .big-btn { display: block; margin: 22px auto 0; padding: 14px 48px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; font-family: inherit; }
  .big-btn:hover { opacity: 0.9; }
  .big-btn:disabled { opacity: 0.5; cursor: default; }

  .stim { text-align: center; padding: 18px 10px 26px; border-bottom: 1px solid var(--rule); margin-bottom: 20px; }
  .stim .pic { width: 100%; max-width: min(340px, 33vh); margin: 0 auto 10px; border: 1px solid var(--ink); }   /* fits upright tablets */
  .stim .txt { font-size: 24px; font-weight: 600; line-height: 1.35; }
  .stim > img { display: block; width: 100%; max-width: 420px; aspect-ratio: 16/9; object-fit: cover; margin: 0 auto 10px; border: 1px solid var(--ink); background: #000; }
  .stim .cat { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); margin-top: 8px; }
  /* Wide screens: picture on the left, the two questions on the right, so the
     whole card fits without scrolling; the picture follows the screen height. */
  @media (min-width: 900px) {
    #card:not(.hidden) { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 28px; align-items: center; }
    #card .stim { grid-row: 1 / 3; border-bottom: 0; margin: 0; padding: 0; }
    #card .stim .pic { width: min(340px, calc(100vh - 190px)); margin: 0; }
    #card .nav { grid-column: 2; }
    #card .likert.rating .lk-item { grid-template-columns: 1fr; gap: 8px; }
  }


  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
  .nav .err { color: var(--accent); font-size: 14px; flex: 1; }
  .nav button { padding: 12px 34px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-family: inherit; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; }
  .nav button:disabled { opacity: 0.5; cursor: default; }
  .hidden { display: none !important; }
</style>
<link rel="stylesheet" href="../shared/touch.css?v=202611112050">
</head>
<body>
<div class="container">
  <header>
    <h1 id="partLabel"></h1>
    <span class="step" id="progress"></span>
  </header>
  <div class="bar"><div id="bar" style="width:0%"></div></div>

  <section class="intro" id="intro">
    <h2 data-i18n="r_title"></h2>
    <p id="introText"></p>
    <button class="big-btn" id="introBtn" data-i18n="start"></button>
  </section>

  <section class="card hidden" id="card">
    <div class="stim" id="stim"></div>
    <div id="questions"></div>
    <div class="nav">
      <div class="err" id="err"></div>
      <button id="nextBtn" data-i18n="next"></button>
    </div>
  </section>

  <section class="intro hidden" id="done">
    <p><b data-i18n="r_done"></b></p>
    <p id="doneNote"></p>
  </section>
</div>

<script src="../shared/config.js?v=202611112050"></script>
<script src="../shared/i18n.js?v=202611112050"></script>
<script src="../shared/videos.js?v=202611112050"></script>
<script src="../shared/stimuli.js?v=202611112050"></script>
<script src="../shared/session.js?v=202611112050"></script>
<script src="../shared/guard.js?v=202611112050"></script>
<script>
/* =============================================================
   RATINGS — stimulus norming (doc "Task 1 Candidate Activity Stimuli v2")
   Each student rates CONFIG.RATINGS_ACTIVITIES_N (15) of the 90 activities,
   picked at random and shown in random order, on two 5-point questions
   (enjoyable now / useful for the quiz).
   ============================================================= */

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const intParam = (name, dflt) => { const v = parseInt(qs.get(name), 10); return Number.isFinite(v) && v >= 0 ? v : dflt; };
const t = (k, v) => Session.t(k, v);
Session.applyI18n();
document.title = t('r_title');

/* The 15 cards and their order come from the student ID (seeded shuffle),
   so a refresh or a return shows the same cards; no ID → random. */
function seeded(str){
  let h = 2166136261;
  for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
const rand = Session.standalone ? Math.random : seeded('ratings:' + Session.pid);
function shuffle(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const PARTS = [
  {
    key: 'activities', label: t('r_part_a'), instr: t('r_act_instr'),
    items: shuffle(ACTIVITIES).slice(0, Math.min(intParam('n', CONFIG.RATINGS_ACTIVITIES_N), ACTIVITIES.length)),
    // two 5-point questions with labelled options (team table 11/02), saved 1–5
    questions: [
      { id: 'enjoy',  label: t('r_act_q1'), scale: [1, 2, 3, 4, 5].map(i => t('r_enjoy_' + i)) },
      { id: 'useful', label: t('r_act_q2'), scale: [1, 2, 3, 4, 5].map(i => t('r_useful_' + i)) },
    ],
    sheet: 'activity_ratings',
    row: (it, vals, extra) => ({ activity_id: it.id, category: it.cat, image: activityImgFile(it),
                                 text_en: it.en, text_pt: it.pt, enjoy: vals.enjoy, useful: vals.useful, ...extra }),
    // The card shows the Portuguese label; other languages get a caption.
    render: it => `${activityPic(it)}${activityCaption(it) ? `<div class="txt">${esc(activityCaption(it))}</div>` : ''}`,
  },
  // (video-preview ratings removed — team doc 10/30: pictures only)
];
// Preload pictures so no item stalls on its image
PARTS[0].items.map(activityImgSrc).forEach(src => { const im = new Image(); im.src = src; });

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let part = 0, idx = 0, shownAt = 0;
let pending = [];          // rows not yet uploaded (chunked saves)

function showIntro(){
  const P = PARTS[part];
  $('partLabel').textContent = P.label;
  $('progress').textContent = '';
  $('introText').textContent = P.instr;
  $('intro').classList.remove('hidden');
  $('card').classList.add('hidden');
}

function showItem(){
  const P = PARTS[part];
  const it = P.items[idx];
  $('intro').classList.add('hidden');
  $('card').classList.remove('hidden');
  $('progress').textContent = t('r_progress', { n: idx + 1, total: P.items.length });
  $('bar').style.width = `${Math.round(100 * idx / P.items.length)}%`;
  $('stim').innerHTML = P.render(it);
  // same answer boxes as the questionnaire (shared/survey.css)
  $('questions').innerHTML = `<div class="likert rating">` + P.questions.map(q => `
    <div class="lk-item" data-q="${q.id}">
      <div class="lk-stmt">${esc(q.label)}</div>
      <div class="lk-opts" style="grid-template-columns:repeat(${q.scale.length},1fr)">` +
        q.scale.map((lab, i) => `<label><input type="radio" name="${q.id}" value="${i + 1}"><span>${esc(lab)}</span></label>`).join('') +
      `</div>
    </div>`).join('') + `</div>`;
  $('questions').querySelectorAll('.lk-item').forEach(it => it.addEventListener('change', () => it.classList.remove('missing')));
  $('err').textContent = '';
  $('nextBtn').textContent = t('next');
  shownAt = performance.now();
  window.scrollTo(0, 0);
}

async function flush(force){
  const P = PARTS[part];
  if (!pending.length) return;
  if (!force && pending.length < CONFIG.RATINGS_SAVE_EVERY) return;
  const rows = pending; pending = [];
  await Session.save({ [P.sheet]: rows }, 'ratings');
}

$('introBtn').addEventListener('click', () => { idx = 0; if (part === 0) Session.status('ratings', 'not_completed'); Session.log(`ratings_${PARTS[part].key}_start`, { n_items: PARTS[part].items.length }); showItem(); });

$('nextBtn').addEventListener('click', async () => {
  const P = PARTS[part];
  const vals = {};
  let missing = false;
  P.questions.forEach(q => {
    const v = $('questions').querySelector(`input[name="${q.id}"]:checked`);
    $('questions').querySelector(`.lk-item[data-q="${q.id}"]`).classList.toggle('missing', !v);
    if (v) vals[q.id] = +v.value; else missing = true;
  });
  if (missing){ $('err').textContent = t('please_answer_all'); return; }
  pending.push(P.row(P.items[idx], vals, { order_idx: idx + 1, rt_ms: Math.round(performance.now() - shownAt) }));
  $('nextBtn').disabled = true;
  idx++;
  Session.progress('ratings', { idx });
  if (idx < P.items.length){
    flush(false);                       // chunked upload in the background
    showItem();
    $('nextBtn').disabled = false;
    return;
  }
  await flush(true);
  Session.log(`ratings_${P.key}_complete`);
  part++;
  $('nextBtn').disabled = false;
  if (part < PARTS.length){ showIntro(); return; }
  finish();
});

async function finish(){
  $('card').classList.add('hidden');
  $('done').classList.remove('hidden');
  $('bar').style.width = '100%';
  $('progress').textContent = '';
  $('doneNote').textContent = t('saving');
  await Session.status('ratings', 'completed');
  await Session.log('ratings_complete', {}, true);
  if (Session.standalone){
    $('doneNote').textContent = 'Standalone run — data is in localStorage (download on done.html).';
  } else {
    Session.next('ratings');
  }
}

// Leaving midway (refresh, tab closed): send the ratings not yet uploaded.
window.addEventListener('pagehide', () => flush(true));

// Refresh / return with the same ID: continue with the next unrated card.
const resumeAt = (Session.progress('ratings') || {}).idx || 0;
if (resumeAt > 0 && resumeAt < PARTS[0].items.length){
  idx = resumeAt;
  Session.log('ratings_resume', { from_item: idx + 1 });
  showItem();
} else showIntro();
</script>
</body>
</html>
