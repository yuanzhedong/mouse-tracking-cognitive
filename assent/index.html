<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- iPad: "Add to Home Screen" opens the site full screen, without the browser bars -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sessão">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../shared/icon-180.png">
<title>Termo de Assentimento</title>
<style>
  :root { --bg:#f4efe4; --panel:#ece5d3; --ink:#1f1e2c; --soft:#7a7587; --accent:#a8324a; --rule:#d8cfb6; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  .container { max-width: 960px; margin: 0 auto; padding: clamp(10px, 3.5vh, 32px) 20px; }

  .card { background: var(--panel); border: 1px solid var(--ink); padding: clamp(14px, min(4vw, 4.5vh), 44px) clamp(20px, 4.5vw, 52px); }
  .card h2 { font-size: clamp(19px, min(2.8vw, 4.2vh), 32px); margin-bottom: 18px; }
  .card p { font-size: clamp(15px, min(2.1vw, 2.9vh), 23px); line-height: 1.5; margin-bottom: clamp(8px, 1.8vh, 16px); }
  .card p.question { font-weight: 600; margin-top: clamp(12px, 2.5vh, 24px); }

  .opts { display: grid; gap: 10px; }
  @media (min-width: 700px) { .opts { grid-template-columns: 1fr 1fr; } }   /* side by side, so the form fits short screens */
  .opts label { display: flex; align-items: center; gap: 12px; padding: clamp(8px, 1.8vh, 14px) 16px; border: 1px solid var(--ink); background: var(--bg); cursor: pointer; font-size: clamp(15px, min(2.1vw, 2.9vh), 22px); }
  .opts label.on { background: var(--ink); color: var(--bg); }
  .opts input { width: 24px; height: 24px; accent-color: var(--accent); }

  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; }
  .nav .err { color: var(--accent); font-size: 17px; flex: 1; }
  .nav button { padding: 14px 44px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-family: inherit; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; }
  .nav button:disabled { opacity: 0.5; cursor: default; }
  .hidden { display: none !important; }
</style>
<link rel="stylesheet" href="../shared/touch.css?v=202611112050">
</head>
<body>
<div class="container">
  <div class="card" id="form">
    <h2 data-i18n="assent_title"></h2>
    <p data-i18n="assent_p1"></p>
    <p data-i18n="assent_p2"></p>
    <p data-i18n="assent_p3"></p>
    <p class="question" data-i18n="assent_question"></p>
    <div class="opts">
      <label><input type="radio" name="assent" value="yes"><span data-i18n="assent_yes"></span></label>
      <label><input type="radio" name="assent" value="no"><span data-i18n="assent_no"></span></label>
    </div>
    <div class="nav">
      <div class="err" id="err"></div>
      <button id="nextBtn" data-i18n="next"></button>
    </div>
  </div>

  <div class="card hidden" id="declined">
    <h2 data-i18n="assent_declined_title"></h2>
    <p data-i18n="assent_declined_text"></p>
  </div>
</div>

<script src="../shared/config.js?v=202611112050"></script>
<script src="../shared/i18n.js?v=202611112050"></script>
<script src="../shared/session.js?v=202611112050"></script>
<script src="../shared/guard.js?v=202611112050"></script>
<script>
/* Student assent, right after the ID. "Sim" → Task 1; "Não" → the session
   ends here. Either answer is saved (table `assent`) so a refusal is on
   record too. */
const $ = id => document.getElementById(id);
Session.applyI18n();
document.title = Session.t('assent_title');
const shownAt = performance.now();

const radios = [...document.querySelectorAll('input[name=assent]')];
radios.forEach(r => r.addEventListener('change', () => {
  radios.forEach(x => x.closest('label').classList.toggle('on', x.checked));
  $('err').textContent = '';
}));

$('nextBtn').addEventListener('click', async () => {
  const v = radios.find(r => r.checked)?.value;
  if (!v){ $('err').textContent = Session.t('assent_choose'); return; }
  $('nextBtn').disabled = true;
  radios.forEach(r => r.disabled = true);
  // answer + completion in one upload, so the next page comes right away
  await Session.save({ assent: [{ assent: v, rt_ms: Math.round(performance.now() - shownAt) }],
                       task_status: [{ task: 'assent', completion_status: 'completed', assent: v }] }, 'assent');
  if (v === 'yes'){ Session.next('assent'); return; }
  await Session.log('assent_declined', {}, true);
  $('form').classList.add('hidden');
  $('declined').classList.remove('hidden');
});

Session.status('assent', 'not_completed');
</script>
</body>
</html>
