<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- iPad: "Add to Home Screen" opens the site full screen, without the browser bars -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sessão">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../shared/icon-180.png">
<title>Questionnaires</title>
<style>
  :root { --bg:#f4efe4; --panel:#ece5d3; --ink:#1f1e2c; --soft:#7a7587; --accent:#a8324a; --rule:#d8cfb6; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  .container { max-width: 1400px; margin: 0 auto; padding: clamp(10px, 3.5vh, 32px) 20px; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; margin-bottom: clamp(8px, 2vh, 20px); border-bottom: 1px solid var(--ink); }
  header h1 { font-size: 16px; font-weight: 600; }
  header .step { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--soft); }
  .bar { height: 3px; background: var(--rule); margin-bottom: clamp(8px, 2.4vh, 24px); }
  .bar div { height: 100%; background: var(--accent); transition: width 0.3s; }

  section.block { background: var(--panel); border: 1px solid var(--ink); padding: clamp(10px, 2.4vh, 26px) 30px; margin-bottom: clamp(8px, 1.8vh, 18px); }
  section.block h2 { font-size: 19px; margin-bottom: 10px; }
  section.block p.instr { font-size: clamp(15px, min(2vw, 3vh), 22px); line-height: 1.55; margin-bottom: 20px; }


  /* top-3 checklist */
  .checks { display: grid; gap: 8px; }
  .checks label { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--ink); background: var(--bg); cursor: pointer; font-size: 15px; }
  .checks label.on { background: var(--ink); color: var(--bg); }
  .checks label.disabled { opacity: 0.45; cursor: not-allowed; }
  .checks input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .checks input[type=text] { flex: 1; padding: 6px 8px; font-family: inherit; font-size: 14px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); }
  .count { margin-top: 12px; font-size: 13px; color: var(--soft); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .piped h3 { font-size: 15px; margin: 22px 0 8px; padding: 8px 12px; background: var(--bg); border-left: 3px solid var(--accent); }

  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
  .nav .err { color: var(--accent); font-size: 14px; flex: 1; }
  .nav button { padding: 14px 44px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-family: inherit; font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; }
  .nav button:hover { opacity: 0.9; }
  .nav button:disabled { opacity: 0.5; cursor: default; }

</style>
<link rel="stylesheet" href="../shared/survey.css?v=202611112006">
<link rel="stylesheet" href="../shared/touch.css?v=202611112006">
</head>
<body>
<div class="container">
  <header>
    <h1 data-i18n="survey_title"></h1>
    <span class="step" id="stepLabel"></span>
  </header>
  <div class="bar"><div id="bar" style="width:0%"></div></div>
  <div id="host"></div>
  <div class="nav">
    <div class="err" id="err"></div>
    <button id="nextBtn" data-i18n="next"></button>
  </div>
</div>

<script src="../shared/config.js?v=202611112006"></script>
<script src="../shared/i18n.js?v=202611112006"></script>
<script src="../shared/surveys.js?v=202611112006"></script>
<script src="../shared/session.js?v=202611112006"></script>
<script src="../shared/guard.js?v=202611112006"></script>
<script src="../shared/surveyrunner.js?v=202611112006"></script>
<script>
Session.applyI18n();
document.title = Session.t('survey_title');
// 4 statements per page, so each page fits a laptop / school PC screen
// without scrolling (same statements, order and scale; saved as items 1–8).
const PAGES = [0, 4].map(i => ({ ...SELF_REPORT[0], items: SELF_REPORT[0].items.slice(i, i + 4) }));
runSurvey({ sections: PAGES, step: 'survey', sheet: 'survey' });
</script>
</body>
</html>
