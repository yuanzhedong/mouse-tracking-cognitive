<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game 2</title>
<link rel="stylesheet" href="../shared/dragcursor.css?v=202610301541">
<style>
  :root {
    --bg:     #f4efe4;
    --panel:  #ece5d3;
    --ink:    #1f1e2c;
    --soft:   #7a7587;
    --accent: #a8324a;
    --rule:   #d8cfb6;
    --good:   #2e7d4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 10px; margin-bottom: 16px;
    border-bottom: 1px solid var(--ink);
    gap: 12px;
  }
  header .hud {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
  }
  header .hud b { font-weight: 600; }
  header .practice-tag {
    padding: 3px 8px; background: var(--accent); color: var(--bg);
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  }

  /* ---------- intro ---------- */
  .intro {
    max-width: 640px; margin: 40px auto;
    background: var(--panel); border: 1px solid var(--ink);
    padding: 32px 36px;
  }
  .intro h2 { font-size: 20px; margin-bottom: 16px; }
  .intro p  { font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
  .intro .big-btn {
    display: block; margin: 24px auto 0;
    padding: 12px 40px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--bg);
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
  }
  .intro .big-btn:hover { opacity: 0.9; }

  /* ---------- lock-screen instructions ---------- */
  .lock-options { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
  .choice-info {
    text-align: left; padding: 16px 20px;
    border: 1px solid var(--ink); background: var(--bg);
  }
  .choice-info .t { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .choice-info .d { font-size: 13px; color: var(--soft); line-height: 1.5; }
  .lock-note { margin-top: 18px; text-align: center; color: var(--soft); }

  /* ---------- lock-screen choice stage (mouse-tracking) ---------- */
  .lock-stage {
    position: relative; aspect-ratio: 4/3;
    max-width: 860px; margin: 20px auto;
    background: var(--panel); border: 1px solid var(--ink);
    overflow: hidden; user-select: none;
  }
  .lock-option {
    position: absolute; top: 22px;
    display: block; padding: 6px;
    background: var(--bg); border: 1px solid var(--ink);
    cursor: pointer; font-family: inherit;
    transition: box-shadow 0.12s ease;
  }
  /* lock_stimuli PNGs (640×480) carry an English caption in the bottom
     band; crop it and show a localized caption instead. */
  .lock-option .pic { display: block; width: 240px; height: 124px; overflow: hidden; }
  .lock-option .pic img { display: block; width: 240px; height: 180px; margin-top: -10px; pointer-events: none; }
  .lock-option .cap {
    display: block; width: 240px; margin-top: 6px; font-size: 13px; line-height: 1.3;
    font-weight: 600; color: var(--ink); text-align: center; pointer-events: none;
  }
  .lock-option:hover { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
  .lock-option.opt-left  { left: 22px; }
  .lock-option.opt-right { right: 22px; }
  .lock-prompt {
    position: absolute; top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 13px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--soft);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .stage-btn {
    position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%);
    padding: 10px 26px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--bg);
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
  }
  .stage-btn:hover { opacity: 0.9; }
  .stage-btn.next-btn { background: var(--accent); border-color: var(--accent); z-index: 3; }

  .lock-option.review { pointer-events: none; cursor: default; }
  .review-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  .review-badge {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: var(--bg);
    padding: 5px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    z-index: 3;
  }
  .review-meta {
    position: absolute; top: 230px; left: 10px;
    background: rgba(244, 239, 228, 0.92);
    border: 1px solid var(--ink);
    padding: 8px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; line-height: 1.55;
    z-index: 3;
  }
  .review-meta b { color: var(--accent); }

  .video-off {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    text-align: center; color: #9a97ac; font-size: 15px; line-height: 1.6;
    padding: 20px; min-height: 380px;
  }
  .video-off .lock-icon { font-size: 42px; }

  /* ---------- split screen ---------- */
  main.split {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    align-items: stretch; min-height: 540px;
  }
  .pane {
    border: 1px solid var(--ink);
    transition: opacity 0.25s ease, filter 0.25s ease;
    display: flex; flex-direction: column;
  }
  .pane.inactive { opacity: 0.45; filter: grayscale(0.4); }
  /* Inactive side is blurred so it can't be followed from the other side.
     Blur the content, not the pane, so the "tap to …" hints stay sharp. */
  .pane .study-label, .pane .study-card, .pane .shorts-label, .pane .player iframe, .pane .next-video {
    transition: filter 0.25s ease;
  }
  .pane.inactive .study-label, .pane.inactive .study-card, .pane.inactive .shorts-label,
  .pane.inactive .player iframe, .pane.inactive .next-video { filter: blur(10px); }
  .pane.inactive .study-card button { pointer-events: none; }

  /* study side */
  .pane.study { background: var(--bg); padding: 22px; }
  .study-label {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--soft); margin-bottom: 20px;
  }
  /* math card (team mock-up): problem, answer box, keypad, then
     eraser (delete one digit) · thinking face (skip) · check (submit) */
  .study-card { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .study-card .qnum { align-self: flex-start; font-size: 15px; color: var(--soft); }
  .study-card .expr {
    font-size: clamp(34px, 6.2vh, 52px); font-weight: 600; letter-spacing: 0.06em; word-spacing: 0.25em;
    margin: 4px 0 clamp(8px, 2vh, 18px); text-align: center; font-variant-numeric: tabular-nums;
  }
  .keypad { background: #fff; border: 1px solid var(--ink); padding: clamp(10px, 1.8vh, 16px) 22px; width: min(320px, 100%); }
  .keypad .display {
    height: clamp(40px, 7vh, 58px); margin-bottom: clamp(8px, 1.6vh, 14px); background: #8a8a8a; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(24px, 4vh, 34px); font-variant-numeric: tabular-nums; transition: background 0.15s;
  }
  .keypad .display.good { background: var(--good); }
  .keypad .display.bad  { background: var(--accent); }
  .keypad .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(7px, 1.4vh, 12px); justify-items: center; }
  .keypad .keys button {
    width: clamp(56px, 8.4vh, 72px); height: clamp(46px, 7.6vh, 64px); background: #111; color: #fff; border: 0; border-radius: 6px;
    font-size: clamp(24px, 3.8vh, 32px); font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .keypad .keys button:active { background: #444; }
  .keypad .keys button.zero { grid-column: 2; }
  .math-actions { display: flex; gap: 48px; margin-top: clamp(8px, 1.8vh, 16px); }
  .math-actions button {
    width: clamp(54px, 8.6vh, 72px); height: clamp(54px, 8.6vh, 72px); border-radius: 50%; border: 0; padding: 0;
    background: transparent; cursor: pointer; font-size: clamp(44px, 7vh, 58px); line-height: 1;
  }
  .math-actions button svg { width: 100%; height: 100%; display: block; }
  .math-actions button:active { transform: scale(0.94); }
  .study-note {
    margin-top: auto; padding-top: 20px; text-align: center;
    font-size: 13px; color: var(--soft);
  }

  /* video side */
  .pane.video { background: #14141c; color: #f2f2f2; padding: 16px; }
  .shorts-label {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px;
  }
  .shorts-label .tag {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #9a97ac;
  }
  .shorts-label .cat {
    font-size: 11px; color: #6f6c80;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .player {
    flex: 1; position: relative; border-radius: 10px; overflow: hidden;
    background: #000; min-height: 380px;
  }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Touch screens: a finger can't hover, and taps on the YouTube iframe
     never reach this page — so while the video side is inactive a shield
     over the player catches the tap that activates it. */
  .tap-shield { position: absolute; inset: 0; z-index: 2; display: none; align-items: center; justify-content: center; cursor: pointer; }
  .pane.video.inactive .tap-shield { display: flex; }
  .tap-hint { display: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; pointer-events: none; }
  .tap-shield .tap-hint { background: rgba(0, 0, 0, 0.65); color: #fff; }
  .study-tap { align-self: center; margin-bottom: 14px; background: var(--ink); color: var(--bg); }
  .touch-ui .pane.inactive .tap-hint { display: block; }
  .next-video {
    margin-top: 12px; width: 100%;
    padding: 10px; border: 1px solid #3a3a4c; border-radius: 8px;
    background: #23232f; color: #d8d6e4; cursor: pointer;
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    font-family: inherit;
  }
  .next-video:hover { background: #2d2d3c; }

  /* ---------- done / researcher ---------- */
  .done {
    max-width: 640px; margin: 40px auto;
    background: var(--bg); border: 1px solid var(--ink);
    padding: 28px 32px; position: relative;
  }
  .done .badge {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: var(--bg);
    padding: 5px 12px; font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .done h2 { font-size: 19px; margin-bottom: 18px; text-align: center; }
  dl.metrics {
    display: grid; grid-template-columns: auto 1fr;
    gap: 6px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
  }
  dl.metrics dt { color: var(--soft); }
  dl.metrics dd { text-align: right; font-weight: 500; }
  .done .controls { display: flex; gap: 10px; margin-top: 22px; }
  .done .controls button {
    flex: 1; padding: 11px 8px; border: 1px solid var(--ink);
    background: var(--bg); cursor: pointer; font-family: inherit;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .done .controls button.primary { background: var(--ink); color: var(--bg); }
  .done .controls button:hover { opacity: 0.85; }

  .hidden { display: none !important; }
  @media (max-width: 700px) { main.split { grid-template-columns: 1fr; } }   /* iPad portrait keeps the split */
</style>
</head>
<body>
<div class="container">

  <!-- shown only during practice: the countdown (no points, no timer in the real blocks) -->
  <header class="hidden" id="topBar">
    <span class="practice-tag" data-i18n="t2_practice_label"></span>
    <span class="hud" id="timeHud">⏱ <b id="timeLeft">0:30</b> <span data-i18n="t2_time_left"></span></span>
  </header>

  <!-- intro -->
  <!-- screen 1 (team doc 界面1) -->
  <section class="intro" id="intro">
    <h2 data-i18n="t2_intro_title"></h2>
    <p id="intro1"></p>
    <p id="intro2"></p>
    <p><b data-i18n="t2_try_first"></b></p>
    <button class="big-btn" id="startBtn" data-i18n="start"></button>

  <!-- practice → block 1 -->
  <!-- screen 3 (界面3): practice → block 1 -->
  <section class="intro hidden" id="practiceDone">
    <h2 data-i18n="t2_practice_done"></h2>
    <p id="pdTime"></p>
    <p data-i18n="t2_pd_math"></p>

      <div class="choice-info">

        <div class="d" id="putAwayDesc"></div>
      </div>
      <div class="choice-info">
        <div class="t" data-i18n="t2_keep"></div>
        <div class="d" data-i18n="t2_keep_desc"></div>
      </div>
    </div>
    <p class="lock-note" data-i18n="t2_no_wrong"></p>
    <button class="big-btn" id="lockContinue" data-i18n="continue_"></button>
  </section>

  <!-- lock-screen choice stage (Task-1-style mouse-tracking trial) -->
  <section class="hidden" id="lockStageWrap">
    <div class="lock-stage" id="lockStage">
      <button class="lock-option opt-left hidden"  id="lockOptLeft">
        <span class="pic"><img id="lockOptLeftImg" alt="" draggable="false"></span>
        <span class="cap" id="lockOptLeftCap"></span>
      </button>
      <button class="lock-option opt-right hidden" id="lockOptRight">
        <span class="pic"><img id="lockOptRightImg" alt="" draggable="false"></span>
        <span class="cap" id="lockOptRightCap"></span>
      </button>
      <div    class="lock-prompt hidden"           id="lockPrompt" data-i18n="t2_make_choice"></div>
      <button class="stage-btn hidden"             id="lockStartBtn" data-i18n="start"></button>
      <canvas class="review-canvas hidden"         id="lockReviewCanvas"></canvas>
      <div    class="review-badge hidden"          id="lockReviewBadge">Researcher view</div>
      <div    class="review-meta hidden"           id="lockReviewMeta"></div>
      <button class="stage-btn next-btn hidden"    id="lockNextBtn" data-i18n="continue_"></button>
    </div>
  </section>

  <!-- split screen -->
  <main class="split hidden" id="split">
    <section class="pane study inactive" id="studyPane">
      <div class="study-label" data-i18n="t2_study"></div>
      <div class="tap-hint study-tap" data-i18n="t2_tap_study"></div>
      <div class="study-card">
        <div class="qnum"><span data-i18n="t2_question"></span> <span id="qNum">1</span></div>
        <div class="expr" id="qText"></div>
        <div class="keypad" id="keypad">
          <div class="display" id="mathDisplay"></div>
          <div class="keys" id="keys">
            <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
            <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
            <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
            <button data-d="0" class="zero">0</button>
          </div>
        </div>
        <div class="math-actions">
          <button id="mathClear" aria-label="clear"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="27" fill="#fff" stroke="#ccc" stroke-width="3"/><g transform="rotate(-35 29 29)"><rect x="13" y="22" width="32" height="15" rx="3" fill="#c98aa6"/><rect x="13" y="22" width="11" height="15" rx="3" fill="#e9c4d4"/></g></svg></button>
          <button id="mathSkip" aria-label="skip">🤔</button>
          <button id="mathSubmit" aria-label="submit"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="#fff" stroke="#5b9e3d" stroke-width="5"/><path d="M17 30 l8 8 l16 -17" fill="none" stroke="#5b9e3d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
    </section>

    <section class="pane video inactive" id="videoPane">
      <div class="shorts-label">
        <span class="tag" data-i18n="t2_shorts"></span>
        <span class="cat" id="vidCat"></span>
      </div>
      <div class="player" id="playerBox"><div id="ytPlayer"></div>
        <div class="tap-shield"><span class="tap-hint" data-i18n="t2_tap_watch"></span></div>
      </div>
      <div class="video-off hidden" id="videoOff">
        <div class="lock-icon">🔒</div>
        <div data-i18n="t2_videos_off"></div>
      </div>
      <button class="next-video" id="nextVideoBtn">⌃ <span data-i18n="t2_next_video"></span></button>

  </main>

  <!-- done -->
  <section class="done hidden" id="done">
    <div class="badge" id="doneBadge">Researcher view</div>
    <h2 data-i18n="t2_times_up"></h2>
    <p id="doneNote" style="text-align:center;color:var(--soft);margin-bottom:14px"></p>

      <dt>accuracy</dt>          <dd id="rAccuracy">—</dd>
      <dt>practice study / video</dt><dd id="rPractice">—</dd>
      <dt>block 1 study / video</dt> <dd id="rBlock1">—</dd>
      <dt>block 2 study / video</dt> <dd id="rBlock2">—</dd>
      <dt>study share</dt>       <dd id="rShare">—</dd>
      <dt>side switches</dt>     <dd id="rSwitches">—</dd>
      <dt>videos completed</dt>  <dd id="rVideos">—</dd>
    </dl>
    <div class="controls" id="doneControls">
      <button class="primary" id="exportBtn">Export CSV</button>
      <button id="restartBtn">Restart</button>
      <button class="primary" id="continueBtn" data-i18n="continue_"></button>
    </div>
  </section>

</div>

<script src="../shared/i18n.js?v=202610301541"></script>
<script src="../shared/session.js?v=202610301541"></script>
<script src="../shared/questions.js?v=202610301541"></script>

<script>
/* =============================================================
   TASK 2 — SPLIT-SCREEN ADT: study content vs. video temptation
   Whichever pane the mouse is over becomes active. Left pane
   serves the fixed math bank (shared/questions.js); right pane
   plays a real YouTube playlist via the IFrame API — playing
   only while the video pane is active.

   Flow (team doc 10/28, 8 min in all):
          intro → PRACTICE 1 min (timer shown) → BLOCK 1 4 min
          → LOCK-SCREEN CHOICE (put the videos away / keep them)
          → BLOCK 2 3 min (video side off if "put away") → summary.
   Neither block shows the time remaining.
   The lock choice is the design's core measure. Time allocation,
   switches, answers, and video events are logged per phase, uploaded
   at the end of each phase, and exportable as CSV.
   ============================================================= */

const qs = new URLSearchParams(location.search);
const secParam = (name, dflt) => {
  const v = parseInt(qs.get(name), 10);
  return Number.isFinite(v) && v > 0 ? v : dflt;
};
const PRACTICE_SEC = secParam('practice', CONFIG.TASK2_PRACTICE_SEC);
const B1_SEC = secParam('b1', secParam('dur', CONFIG.TASK2_BLOCK1_SEC)); // block 1, before the lock choice
const B2_SEC = secParam('b2', secParam('dur', CONFIG.TASK2_BLOCK2_SEC)); // block 2, after it
const PHASE_SEC = { practice: PRACTICE_SEC, block1: B1_SEC, block2: B2_SEC };
const TICK_MS = 200;
const REVIEW = Session.review;
// Primary input can't hover (iPad / phone without a mouse): tap-to-switch UI and instructions.
const TOUCH_UI = matchMedia('(hover: none)').matches;
if (TOUCH_UI) document.body.classList.add('touch-ui');

/* ---------- participant-facing text ---------- */
Session.applyI18n();
document.title = Session.t('t2_title');
{
  const mainMin  = Math.round(B2_SEC / 60);
  const totalMin = Math.round((PRACTICE_SEC + B1_SEC + B2_SEC) / 60);
  document.getElementById('intro1').innerHTML = Session.t(TOUCH_UI ? 't2_intro_1_touch' : 't2_intro_1', { min: totalMin });
  document.getElementById('intro2').innerHTML = Session.t('t2_intro_2');
  document.getElementById('lockIntro').innerHTML = Session.t('t2_lock_intro', { min: mainMin });
  document.getElementById('pdTime').textContent = Session.t('t2_pd_time', { min: Math.round((B1_SEC + B2_SEC) / 60) });
  document.getElementById('putAwayDesc').textContent = Session.t('t2_put_away_desc', { min: mainMin });
}

// VIDEOS comes from ../shared/videos.js; QuestionBank from ../shared/questions.js

const $ = id => document.getElementById(id);

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const state = {
  phase: 'intro',        // intro | practice | practice_done | block1 | lock | block2 | done
  startTime: null,
  phaseElapsedMs: 0,
  phaseSec: PRACTICE_SEC,
  points: 0,
  qNum: 1,
  currentQ: null,
  answerLock: false,
  activeSide: null,      // 'study' | 'video' | null
  dwell: {
    practice: { study: 0, video: 0, none: 0 },
    block1:   { study: 0, video: 0, none: 0 },
    block2:   { study: 0, video: 0, none: 0 },
  },
  switches: 0,
  playlist: shuffle(VIDEOS),
  vidIdx: 0,
  videosCompleted: 0,
  lockChoice: null,      // 'put_away' | 'keep'
  lockMetrics: null,     // AUC/MD etc. of the lock-choice trajectory
  videoLocked: false,
  events: [],
  timer: null,
};

const running = () => state.phase in PHASE_SEC;
const now = () => state.startTime === null ? 0 : Math.round(performance.now() - state.startTime);

function logEvent(type, detail = {}){
  state.events.push({ t_ms: now(), phase: state.phase, type, ...detail });
}

/* ---------- YouTube player ---------- */

let player = null, playerReady = false;

const yt = document.createElement('script');
yt.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(yt);

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('ytPlayer', {
    videoId: state.playlist[0].id,
    playerVars: { playsinline: 1, rel: 0, controls: 1, mute: 1 },
    events: {
      onReady: () => { playerReady = true; updateVidCat(); },
      onStateChange: e => {
        if (!running()) return;
        const v = state.playlist[state.vidIdx];
        if (e.data === YT.PlayerState.ENDED){
          state.videosCompleted++;
          logEvent('video_complete', { video_id: v.id, video_category: v.cat });
          loadVideo(state.vidIdx + 1, 'autoplay');
        } else if (e.data === YT.PlayerState.PLAYING){
          logEvent('video_play',  { video_id: v.id, video_category: v.cat });
        } else if (e.data === YT.PlayerState.PAUSED){
          logEvent('video_pause', { video_id: v.id, video_category: v.cat });
        }
      },
    },
  });
};

function updateVidCat(){
  $('vidCat').textContent =
    `${Session.pick(VIDEO_CAT_LABELS[state.playlist[state.vidIdx].cat]) || state.playlist[state.vidIdx].cat} · ${state.vidIdx + 1}/${state.playlist.length}`;
}

function loadVideo(idx, reason){
  state.vidIdx = ((idx % state.playlist.length) + state.playlist.length) % state.playlist.length;
  const v = state.playlist[state.vidIdx];
  updateVidCat();
  if (playerReady){
    if (state.activeSide === 'video') player.loadVideoById(v.id);
    else                              player.cueVideoById(v.id);
  }
  logEvent('video_load', { video_id: v.id, video_category: v.cat, reason });
}

$('nextVideoBtn').addEventListener('click', () => {
  if (!running() || state.activeSide !== 'video') return;
  const v = state.playlist[state.vidIdx];
  logEvent('video_skip', { video_id: v.id, video_category: v.cat });
  loadVideo(state.vidIdx + 1, 'user_skip');
});

/* ---------- study side ---------- */

/* Keypad answering (team mock-up): digits build the answer, the eraser
   deletes the last digit, the thinking face skips the question, the check
   submits.
   The keyboard works too (digits, Backspace, Enter) while the study side
   is active. Every submit logs an 'answer' event, every skip a 'skip'. */
let typed = '';
const MAX_DIGITS = 3;
function showTyped(){ $('mathDisplay').textContent = typed; }

function serveQuestion(){
  state.currentQ = QuestionBank.next();
  state.answerLock = false;
  state.qShownAt = now();
  typed = ''; showTyped();
  $('mathDisplay').className = 'display';
  $('qNum').textContent = state.qNum;
  $('qText').textContent = state.currentQ.text;
}
const canAnswer = () => running() && state.activeSide === 'study' && !state.answerLock;
function nextQuestion(delay){
  setTimeout(() => { if (!running()) return; state.qNum++; serveQuestion(); }, delay);
}
function qFields(){
  return { question_id: state.currentQ.id, level: state.currentQ.level, question: state.currentQ.text,
           correct_answer: state.currentQ.answer, q_ms: now() - state.qShownAt };
}
function pressDigit(d){
  if (!canAnswer() || typed.length >= MAX_DIGITS) return;
  typed = (typed === '0' ? '' : typed) + d; showTyped();
}
function eraseDigit(){                 // one digit per click (eraser or Backspace)
  if (!canAnswer() || !typed) return;
  logEvent('erase', { question_id: state.currentQ.id, erased: typed.slice(-1), before: typed });
  typed = typed.slice(0, -1); showTyped();
}
function skipQuestion(){
  if (!canAnswer()) return;
  state.answerLock = true;
  logEvent('skip', { ...qFields(), typed_before_skip: typed });
  nextQuestion(150);
}
function submitAnswer(){
  if (!canAnswer() || typed === '') return;
  state.answerLock = true;
  const given = parseInt(typed, 10);
  const correct = given === state.currentQ.answer;
  if (correct) state.points++;
  logEvent('answer', { ...qFields(), given, is_correct: correct, points_total: state.points });
  $('mathDisplay').classList.add(correct ? 'good' : 'bad');
  nextQuestion(450);
}
// the tap that activated the study side must not also press a key
const guard = fn => e => { if (swallowClick){ swallowClick = false; return; } fn(e); };
$('keys').addEventListener('click', guard(e => { const b = e.target.closest('button'); if (b) pressDigit(b.dataset.d); }));
$('mathClear').addEventListener('click', guard(eraseDigit));
$('mathSkip').addEventListener('click', guard(skipQuestion));
$('mathSubmit').addEventListener('click', guard(submitAnswer));
document.addEventListener('keydown', e => {
  if (!canAnswer()) return;
  if (/^[0-9]$/.test(e.key)) pressDigit(e.key);
  else if (e.key === 'Backspace'){ e.preventDefault(); eraseDigit(); }
  else if (e.key === 'Enter') submitAnswer();
});

/* ---------- side activation ---------- */

/* via: 'hover' (mouse enters the side) | 'tap' (finger/pen) | 'click' (mouse
   press — rarely needed, the hover already switched). */
function setActive(side, via){
  if (!running() || state.activeSide === side) return;
  if (side === 'video' && state.videoLocked) return;   // locked side is dead
  if (state.activeSide !== null) state.switches++;     // first hover of a phase isn't a switch
  state.activeSide = side;
  logEvent('switch', { side, via });
  $('studyPane').classList.toggle('inactive', side !== 'study');
  $('videoPane').classList.toggle('inactive', side !== 'video');
  if (playerReady){
    if (side === 'video') player.playVideo();
    else                  player.pauseVideo();
  }
}

$('studyPane').addEventListener('mouseenter', () => setActive('study', 'hover'));
$('videoPane').addEventListener('mouseenter', () => setActive('video', 'hover'));
// Touch screens have no hover: tapping a side makes it active (the first tap
// on an inactive study side only activates it, it doesn't answer).
const viaOf = e => e.pointerType === 'mouse' ? 'click' : 'tap';
let swallowClick = false;   // the tap that activated the study side must not also answer
$('studyPane').addEventListener('pointerdown', e => {
  const was = state.activeSide;
  setActive('study', viaOf(e));
  swallowClick = was !== state.activeSide;
});
$('videoPane').addEventListener('pointerdown', e => setActive('video', viaOf(e)));

/* ---------- session loop ---------- */

function tick(){
  state.phaseElapsedMs += TICK_MS;
  state.dwell[state.phase][state.activeSide || 'none'] += TICK_MS;

  const remain = Math.max(0, state.phaseSec - state.phaseElapsedMs / 1000);
  const mm = Math.floor(remain / 60);
  const ss = Math.floor(remain % 60);
  $('timeLeft').textContent = `${mm}:${String(ss).padStart(2, '0')}`;
  if (remain <= 0){
    if (state.phase === 'practice')    showPracticeDone();
    else if (state.phase === 'block1') enterLockScreen();
    else                               endSession();
  }
}

/* Upload the events logged since the last upload (end of each phase), so
   a student who leaves midway keeps the phases already done. */
let savedEvents = 0;
function saveEvents(){
  const rows = state.events.slice(savedEvents);
  savedEvents = state.events.length;
  return rows.length ? Session.save({ task2_events: rows.map(e => ({ ...e })) }, 'task2') : Promise.resolve();
}
window.addEventListener('pagehide', () => { if (state.phase !== 'done') saveEvents(); });

function pauseSplit(){
  clearInterval(state.timer);
  state.activeSide = null;
  if (playerReady && !state.videoLocked) player.pauseVideo();
  $('split').classList.add('hidden');
  $('topBar').classList.add('hidden');
}
function showPracticeDone(){
  pauseSplit();
  state.phase = 'practice_done';
  $('practiceDone').classList.remove('hidden');
  logEvent('practice_done_shown');
  saveEvents();
}
$('block1Btn').addEventListener('click', () => {
  if (state.phase !== 'practice_done') return;
  $('practiceDone').classList.add('hidden');
  beginPhase('block1', B1_SEC);
});

function beginPhase(phase, sec){
  state.phase = phase;
  state.phaseSec = sec;
  state.phaseElapsedMs = 0;
  state.activeSide = null;
  $('studyPane').classList.add('inactive');
  $('videoPane').classList.toggle('inactive', true);
  $('lockScreen').classList.add('hidden');
  $('lockStageWrap').classList.add('hidden');
  $('intro').classList.add('hidden');
  $('done').classList.add('hidden');
  $('split').classList.remove('hidden');
  $('topBar').classList.toggle('hidden', phase !== 'practice');   // no countdown in the real blocks
  logEvent('phase_start', { duration_sec: sec });
  state.timer = setInterval(tick, TICK_MS);
}

function startSession(){
  state.startTime = performance.now();
  logEvent('session_start', { practice_sec: PRACTICE_SEC, block1_sec: B1_SEC, block2_sec: B2_SEC });
  Session.status('task2', 'not_completed');
  serveQuestion();
  updateVidCat();
  beginPhase('practice', PRACTICE_SEC);
}

function enterLockScreen(){
  pauseSplit();
  state.phase = 'lock';
  $('lockScreen').classList.remove('hidden');
  logEvent('lock_instructions_shown');
  saveEvents();
}

/* The choice itself is a Task-1-style mouse-tracking trial: Start button
   at the bottom center, the two options at the top corners (sides
   randomized), cursor sampled from the Start click to the choice click,
   scored with the shared AUC/MD metrics. */

const lockTrial = {
  started: false,
  done: false,
  samples: [],
  startPos: null,
  startTime: null,
  stageRect: null,
  leftChoice: null,   // 'put_away' | 'keep'
};

const LOCK_STIMULI = {
  put_away: { img: 'lock_stimuli/lock_fun_screen.png',   label: Session.t('t2_put_away') },
  keep:     { img: 'lock_stimuli/keep_both_screens.png', label: Session.t('t2_keep') },
};
// Preload so both cards appear instantly when the trial starts
Object.values(LOCK_STIMULI).forEach(s => { const im = new Image(); im.src = s.img; });

$('lockContinue').addEventListener('click', () => {
  if (state.phase !== 'lock') return;
  $('lockScreen').classList.add('hidden');
  $('lockStageWrap').classList.remove('hidden');
  $('lockStartBtn').classList.remove('hidden');
  logEvent('lock_stage_shown');
});

/* inputType: 'mouse' (click) or, via the drag cursor, 'touch' / 'pen' /
   'mouse_drag'. Returns true if the trial started. */
function startLockTrial(e, inputType = 'mouse'){
  if (state.phase !== 'lock' || lockTrial.started) return false;
  lockTrial.started = true;
  lockTrial.inputType = inputType;
  lockTrial.stageRect = $('lockStage').getBoundingClientRect();
  lockTrial.startPos = { x: e.clientX, y: e.clientY };
  lockSampler.start(e.clientX, e.clientY);
  lockTrial.leftChoice = Math.random() < 0.5 ? 'put_away' : 'keep';
  const rightChoice = lockTrial.leftChoice === 'put_away' ? 'keep' : 'put_away';
  $('lockOptLeftImg').src  = LOCK_STIMULI[lockTrial.leftChoice].img;
  $('lockOptLeftImg').alt  = LOCK_STIMULI[lockTrial.leftChoice].label;
  $('lockOptLeftCap').textContent = LOCK_STIMULI[lockTrial.leftChoice].label;
  $('lockOptRightImg').src = LOCK_STIMULI[rightChoice].img;
  $('lockOptRightImg').alt = LOCK_STIMULI[rightChoice].label;
  $('lockOptRightCap').textContent = LOCK_STIMULI[rightChoice].label;
  $('lockStartBtn').classList.add('hidden');
  $('lockOptLeft').classList.remove('hidden');
  $('lockOptRight').classList.remove('hidden');
  $('lockPrompt').classList.remove('hidden');
  return true;
}
$('lockStartBtn').addEventListener('click', e => startLockTrial(e));

// Fixed-rate sampling (still periods included), as in Task 1.
const lockSampler = createSampler(CONFIG.TASK1_SAMPLE_MS, CONFIG.TASK1_MOVE_THRESHOLD_PX);
const addLockSample = (x, y) => lockSampler.move(x, y);
document.addEventListener('mousemove', e => {
  if (state.phase !== 'lock' || !lockTrial.started || lockTrial.done || lockDrag.active) return;
  addLockSample(e.clientX, e.clientY);
});
const lockDrag = DragCursor.create({
  stage: $('lockStage'), startBtn: $('lockStartBtn'), targets: [$('lockOptLeft'), $('lockOptRight')],
  hint: Session.t('drag_hint'),
  onStart: startLockTrial,
  onMove: (x, y) => { if (lockTrial.started && !lockTrial.done) addLockSample(x, y); },
  onDrop: (i, e) => pickLock(i === 0 ? 'left' : 'right', e),
});

function centerOf(el){
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function pickLock(side, e){
  if (state.phase !== 'lock' || !lockTrial.started || lockTrial.done) return;
  lockTrial.done = true;
  const choice = side === 'left'
    ? lockTrial.leftChoice
    : (lockTrial.leftChoice === 'put_away' ? 'keep' : 'put_away');
  const rt = lockSampler.stop(e.clientX, e.clientY);
  lockTrial.samples = lockSampler.samples;
  const initTime = lockSampler.firstMoveT;

  const btn = side === 'left' ? $('lockOptLeft') : $('lockOptRight');
  const m = computeMetrics(lockTrial.samples, lockTrial.startPos, centerOf(btn));
  state.lockChoice = choice;
  state.lockMetrics = m;
  logEvent('lock_choice', {
    choice,
    side,
    left_option: lockTrial.leftChoice,
    auc: m.auc.toFixed(6),
    md: m.md.toFixed(6),
    x_flips: m.xFlips,
    rt_ms: Math.round(rt),
    init_ms: initTime !== null ? Math.round(initTime) : '',
    input_type: lockTrial.inputType,
    n_samples: lockTrial.samples.length,
  });
  // time-normalized trajectory (101 bins) as JSON arrays in one event
  const r0 = lockTrial.stageRect;
  state.events.push({
    t_ms: now(), phase: 'lock', type: 'lock_trajectory', n_bins: m.normalized.length,
    // raw fixed-rate samples: t ms from the options appearing, x/y px in the stage
    samples_t: JSON.stringify(lockTrial.samples.map(p => Math.round(p.t))),
    samples_x: JSON.stringify(lockTrial.samples.map(p => Math.round(p.x - r0.left))),
    samples_y: JSON.stringify(lockTrial.samples.map(p => Math.round(p.y - r0.top))),
    x_norm: JSON.stringify(m.normalized.map(p => +p.x.toFixed(5))),
    y_norm: JSON.stringify(m.normalized.map(p => +p.y.toFixed(5))),
  });

  if (choice === 'put_away'){
    state.videoLocked = true;
    if (playerReady) player.stopVideo();
    $('playerBox').classList.add('hidden');
    $('nextVideoBtn').classList.add('hidden');
    $('videoOff').classList.remove('hidden');
    $('vidCat').textContent = '';
  }

  if (!REVIEW){
    ['lockOptLeft','lockOptRight','lockPrompt'].forEach(id => $(id).classList.add('hidden'));
    $('lockStageWrap').classList.add('hidden');
    setTimeout(() => beginPhase('block2', B2_SEC), 300);
    return;
  }
  // Researcher view of the choice trajectory (Task-1 style) before the
  // block 2 starts.
  const chosenBtn = side === 'left' ? $('lockOptLeft') : $('lockOptRight');
  showLockReview({
    samples:   lockTrial.samples,
    startPos:  lockTrial.startPos,
    leftPos:   centerOf($('lockOptLeft')),
    rightPos:  centerOf($('lockOptRight')),
    chosenPos: centerOf(chosenBtn),
    stageRect: lockTrial.stageRect,
    mdIdx:     m.mdIdx,
  }, choice, m, rt, initTime);
}

function showLockReview(trial, choice, m, rt, initTime){
  $('lockPrompt').classList.add('hidden');
  $('lockOptLeft').classList.add('review');
  $('lockOptRight').classList.add('review');
  $('lockReviewCanvas').classList.remove('hidden');
  $('lockReviewBadge').classList.remove('hidden');
  $('lockReviewMeta').classList.remove('hidden');
  $('lockNextBtn').classList.remove('hidden');
  $('lockReviewMeta').innerHTML =
    `chose <b>${LOCK_STIMULI[choice].label}</b><br>` +
    `AUC <b>${m.auc.toFixed(3)}</b> · MD <b>${m.md.toFixed(3)}</b><br>` +
    `x-flips ${m.xFlips} · RT ${Math.round(rt)} ms<br>` +
    `init ${initTime !== null ? Math.round(initTime) + ' ms' : '—'}`;
  drawTrajectoryReview($('lockReviewCanvas'), $('lockStage'), trial);
}

$('lockNextBtn').addEventListener('click', () => {
  if (state.phase !== 'lock' || !lockTrial.done) return;
  ['lockReviewCanvas','lockReviewBadge','lockReviewMeta','lockNextBtn',
   'lockOptLeft','lockOptRight'].forEach(id => $(id).classList.add('hidden'));
  $('lockOptLeft').classList.remove('review');
  $('lockOptRight').classList.remove('review');
  $('lockStageWrap').classList.add('hidden');
  beginPhase('block2', B2_SEC);
});

$('lockOptLeft').addEventListener('click',  e => pickLock('left', e));
$('lockOptRight').addEventListener('click', e => pickLock('right', e));

function endSession(){
  clearInterval(state.timer);
  state.phase = 'done';
  $('topBar').classList.add('hidden');
  if (playerReady && !state.videoLocked) player.pauseVideo();
  logEvent('session_end', { points_total: state.points });

  const attempted = state.events.filter(e => e.type === 'answer').length;
  const correct   = state.events.filter(e => e.type === 'answer' && e.is_correct).length;
  const fmt = ms => {
    const s = Math.round(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  const d = state.dwell;
  const studyMs  = d.block1.study + d.block2.study;
  const activeMs = studyMs + d.block1.video + d.block2.video;

  $('rLock').textContent      = state.lockChoice === 'put_away' ? 'put videos away'
                              : state.lockChoice === 'keep'     ? 'kept videos' : '—';
  $('rLockAUC').textContent   = state.lockMetrics
    ? `${state.lockMetrics.auc.toFixed(3)} / ${state.lockMetrics.md.toFixed(3)}`
    : '—';
  $('rPoints').textContent    = state.points;
  $('rAttempted').textContent = attempted;
  $('rAccuracy').textContent  = attempted ? `${Math.round(100 * correct / attempted)}%` : '—';
  $('rPractice').textContent  = `${fmt(d.practice.study)} / ${fmt(d.practice.video)}`;
  $('rBlock1').textContent    = `${fmt(d.block1.study)} / ${fmt(d.block1.video)}`;
  $('rBlock2').textContent    = `${fmt(d.block2.study)} / ${fmt(d.block2.video)}`;
  $('rShare').textContent     = activeMs ? `${Math.round(100 * studyMs / activeMs)}% study (blocks 1–2)` : '—';
  $('rSwitches').textContent  = state.switches;
  $('rVideos').textContent    = state.videosCompleted;

  $('split').classList.add('hidden');
  $('done').classList.remove('hidden');

  // researcher panel only in review mode
  $('doneBadge').classList.toggle('hidden', !REVIEW);
  document.querySelector('#done dl.metrics').classList.toggle('hidden', !REVIEW);
  $('exportBtn').classList.toggle('hidden', !REVIEW);
  $('restartBtn').classList.toggle('hidden', !Session.standalone);
  $('continueBtn').classList.toggle('hidden', Session.standalone);
  $('doneNote').textContent = Session.t('saving');
  saveSession().then(() => {
    $('doneNote').textContent = '';
    if (!REVIEW && !Session.standalone) Session.next('task2');
  });
}

function summaryRow(){
  const attempted = state.events.filter(e => e.type === 'answer').length;
  const correct   = state.events.filter(e => e.type === 'answer' && e.is_correct).length;
  const d = state.dwell, m = state.lockMetrics;
  return {
    practice_sec: PRACTICE_SEC, block1_sec: B1_SEC, block2_sec: B2_SEC,
    lock_choice: state.lockChoice,
    lock_auc: m ? +m.auc.toFixed(6) : '', lock_md: m ? +m.md.toFixed(6) : '', lock_x_flips: m ? m.xFlips : '',
    points: state.points, attempted, correct,
    skipped: state.events.filter(e => e.type === 'skip').length,
    accuracy: attempted ? +(correct / attempted).toFixed(3) : '',
    practice_study_ms: d.practice.study, practice_video_ms: d.practice.video, practice_none_ms: d.practice.none,
    block1_study_ms: d.block1.study, block1_video_ms: d.block1.video, block1_none_ms: d.block1.none,
    block2_study_ms: d.block2.study, block2_video_ms: d.block2.video, block2_none_ms: d.block2.none,
    switches: state.switches, videos_completed: state.videosCompleted,
    touch_ui: TOUCH_UI,
    taps: state.events.filter(e => e.type === 'switch' && e.via === 'tap').length,
  };
}
let saved = false;
async function saveSession(){
  if (saved) return; saved = true;
  await saveEvents();
  await Session.save({ task2_summary: [summaryRow()] }, 'task2');
  await Session.status('task2', 'completed', { lock_choice: state.lockChoice });
  await Session.log('task2_complete', { lock_choice: state.lockChoice });
}
$('continueBtn').addEventListener('click', () => Session.next('task2'));

$('startBtn').addEventListener('click', () => { Session.log('task2_start', { practice_sec: PRACTICE_SEC, block1_sec: B1_SEC, block2_sec: B2_SEC }); startSession(); });
$('restartBtn').addEventListener('click', () => {
  Object.assign(state, {
    phase: 'intro', startTime: null, phaseElapsedMs: 0, phaseSec: PRACTICE_SEC,
    points: 0, qNum: 1, currentQ: null, answerLock: false, activeSide: null,
    dwell: {
      practice: { study: 0, video: 0, none: 0 },
      block1:   { study: 0, video: 0, none: 0 },
      block2:   { study: 0, video: 0, none: 0 },
    },
    switches: 0, playlist: shuffle(VIDEOS), vidIdx: 0, videosCompleted: 0,
    lockChoice: null, lockMetrics: null, videoLocked: false, events: [],
  });
  Object.assign(lockTrial, {
    started: false, done: false, samples: [], startPos: null, startTime: null,
    stageRect: null, leftChoice: null,
  });
  ['lockReviewCanvas','lockReviewBadge','lockReviewMeta','lockNextBtn']
    .forEach(id => $(id).classList.add('hidden'));
  $('lockOptLeft').classList.remove('review');
  $('lockOptRight').classList.remove('review');
  QuestionBank.reset();
  $('playerBox').classList.remove('hidden');
  $('nextVideoBtn').classList.remove('hidden');
  $('videoOff').classList.add('hidden');
  $('lockOptLeft').classList.add('hidden');
  $('lockOptRight').classList.add('hidden');
  $('lockPrompt').classList.add('hidden');
  if (playerReady) player.cueVideoById(state.playlist[0].id);
  saved = false; savedEvents = 0;
  startSession();
});

/* ---------- export ---------- */

$('exportBtn').addEventListener('click', () => {
  const header = ['t_ms','phase','event','side','question_id','level','question','given',
                  'correct_answer','is_correct','points_total',
                  'video_id','video_category','choice','left_option',
                  'auc','md','x_flips','rt_ms','init_ms',
                  't_norm','x_norm','y_norm','reason'];
  const q = s => {
    s = String(s ?? '');
    return /[,"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const rows = [header.join(',')];
  state.events.forEach(e => {
    rows.push([
      e.t_ms, e.phase ?? '', e.type, e.side ?? '', e.question_id ?? '', e.level ?? '',
      q(e.question), e.given ?? '', e.correct_answer ?? '', e.is_correct ?? '',
      e.points_total ?? '', e.video_id ?? '', e.video_category ?? '',
      e.choice ?? '', e.left_option ?? '',
      e.auc ?? '', e.md ?? '', e.x_flips ?? '', e.rt_ms ?? '', e.init_ms ?? '',
      e.t_norm ?? '', e.x_norm ?? '', e.y_norm ?? '', e.reason ?? '',
    ].join(','));
  });
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `task2-split-screen-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

/* ---------- init ---------- */

$('timeLeft').textContent =
  `${Math.floor(PRACTICE_SEC / 60)}:${String(PRACTICE_SEC % 60).padStart(2, '0')}`;
</script>
</body>
