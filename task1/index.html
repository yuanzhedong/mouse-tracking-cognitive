<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game 1</title>
<style>
  :root {
    --bg:     #f4efe4;
    --panel:  #ece5d3;
    --ink:    #1f1e2c;
    --soft:   #7a7587;
    --accent: #a8324a;
    --rule:   #d8cfb6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  header {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding-bottom: 10px; margin-bottom: 16px;
    border-bottom: 1px solid var(--ink);
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.4; }
  header .trial { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--soft); white-space: nowrap; }
  header .trial b { color: var(--ink); font-weight: 600; }
  header .badge {
    display: inline-block; margin-right: 10px; padding: 3px 8px;
    background: var(--accent); color: var(--bg);
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    vertical-align: middle;
  }

  /* intro / interstitial cards */
  .intro {
    max-width: 640px; margin: 40px auto;
    background: var(--panel); border: 1px solid var(--ink);
    padding: 32px 36px;
  }
  .intro h2 { font-size: 20px; margin-bottom: 16px; }
  .intro p  { font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
  .intro .big-btn {
    display: block; margin: 24px auto 0;
    padding: 12px 40px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--bg);
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
  }
  .intro .big-btn:hover { opacity: 0.9; }

  main {
    display: grid; grid-template-columns: minmax(0,1fr) 260px;
    gap: 16px; align-items: start;
  }
  main.no-aside { grid-template-columns: minmax(0,1fr); max-width: 900px; margin: 0 auto; }

  .stage {
    position: relative; aspect-ratio: 4/3;
    background: var(--panel); border: 1px solid var(--ink);
    overflow: hidden; user-select: none;
  }

  .option {
    position: absolute; top: 22px;
    display: block; padding: 6px 6px 8px;
    background: var(--bg); border: 1px solid var(--ink);
    cursor: pointer; font-family: inherit;
    transition: box-shadow 0.12s ease;
    width: 176px;
  }
  /* The stimulus PNGs carry an English title in the top ~16 %; crop it and
     show a localized caption instead. */
  .option .pic { display: block; width: 164px; height: 128px; overflow: hidden; }
  .option .pic img { display: block; width: 200px; height: 200px; margin: -66px 0 0 -18px; pointer-events: none; }
  .option .cap {
    display: block; margin-top: 6px; font-size: 12px; line-height: 1.3;
    font-weight: 600; color: var(--ink); text-align: center; min-height: 32px;
    pointer-events: none;
  }
  .option:hover { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
  .option.opt-left  { left: 22px; }
  .option.opt-right { right: 22px; }
  .option.review { pointer-events: none; cursor: default; }

  .stimulus {
    position: absolute; top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--soft);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .stage-btn {
    position: absolute; left: 50%; transform: translateX(-50%);
    padding: 12px 30px; border: 1px solid var(--ink);
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
  }
  .start-btn { bottom: 30px; background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .next-btn  { bottom: 20px; background: var(--accent); color: var(--bg); border-color: var(--accent); z-index: 3; }
  .stage-btn:hover { opacity: 0.9; }

  .warn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--accent); color: var(--bg);
    padding: 16px 24px; font-size: 16px; font-weight: 600; text-align: center;
    max-width: 70%; z-index: 4;
  }

  .review-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  .review-badge {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: var(--bg);
    padding: 5px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    z-index: 3;
  }
  .done-panel {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 3;
  }
  .done-panel h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .done-panel p  { font-size: 13px; color: var(--soft); }
  .review-meta {
    position: absolute; top: 230px; left: 10px;
    background: rgba(244, 239, 228, 0.92);
    border: 1px solid var(--ink);
    padding: 8px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; line-height: 1.55;
    z-index: 3;
  }
  .review-meta b { color: var(--accent); }

  .hidden { display: none !important; }

  aside { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--bg); border: 1px solid var(--ink);
    padding: 12px 14px;
  }
  .card h3 {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--soft);
    padding-bottom: 6px; margin-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  dl.metrics {
    display: grid; grid-template-columns: auto 1fr;
    gap: 4px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  dl.metrics dt { color: var(--soft); }
  dl.metrics dd { text-align: right; font-weight: 500; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .controls button {
    padding: 9px 8px; border: 1px solid var(--ink);
    background: var(--bg); cursor: pointer; font-family: inherit;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .controls button.primary { background: var(--ink); color: var(--bg); }
  .controls button:hover { opacity: 0.85; }

  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1><span class="badge hidden" id="practiceBadge"></span><span id="prompt"></span></h1>
    <span class="trial" id="trialLabel"></span>
  </header>

  <!-- instructions -->
  <section class="intro" id="intro">
    <h2 data-i18n="t1_title"></h2>
    <p data-i18n="t1_instr_1"></p>
    <p data-i18n="t1_instr_2"></p>
    <p><b data-i18n="t1_practice_intro"></b></p>
    <button class="big-btn" id="introBtn" data-i18n="start"></button>
  </section>

  <!-- practice → main interstitial -->
  <section class="intro hidden" id="interstitial">
    <p><b data-i18n="t1_practice_done"></b></p>
    <p id="interPrompt"></p>
    <button class="big-btn" id="interBtn" data-i18n="continue_"></button>
  </section>

  <main class="hidden" id="main">
    <div class="stage" id="stage">
      <button class="option opt-left hidden" id="optLeft">
        <span class="pic"><img id="optLeftImg" alt="" draggable="false"></span>
        <span class="cap" id="optLeftCap"></span>
      </button>
      <button class="option opt-right hidden" id="optRight">
        <span class="pic"><img id="optRightImg" alt="" draggable="false"></span>
        <span class="cap" id="optRightCap"></span>
      </button>
      <div    class="stimulus hidden"         id="stimulus"></div>
      <button class="stage-btn start-btn"     id="startBtn"></button>
      <div    class="warn hidden"             id="warn"></div>
      <canvas class="review-canvas hidden"    id="reviewCanvas"></canvas>
      <div    class="review-badge hidden"     id="reviewBadge">Researcher view</div>
      <div    class="review-meta hidden"      id="reviewMeta"></div>
      <div    class="done-panel hidden"       id="donePanel">
        <h2 data-i18n="t1_done"></h2>
        <p id="doneNote"></p>
      </div>
      <button class="stage-btn next-btn hidden" id="nextBtn"></button>
    </div>

    <aside id="aside">
      <div class="card">
        <h3>Last trial</h3>
        <dl class="metrics">
          <dt>chose</dt>   <dd id="lastChoice">—</dd>
          <dt>AUC</dt>     <dd id="lastAUC">—</dd>
          <dt>MD</dt>      <dd id="lastMD">—</dd>
          <dt>x-flips</dt> <dd id="lastFlips">—</dd>
          <dt>RT</dt>      <dd id="lastRT">—</dd>
          <dt>init</dt>    <dd id="lastInit">—</dd>
        </dl>
      </div>

      <div class="card">
        <h3>Aggregate · n=<span id="nTrials">0</span></h3>
        <dl class="metrics">
          <dt>condition</dt> <dd id="condLabel">—</dd>
          <dt>mean AUC</dt> <dd id="meanAUC">—</dd>
          <dt>mean MD</dt>  <dd id="meanMD">—</dd>
          <dt>mean RT</dt>  <dd id="meanRT">—</dd>
        </dl>
      </div>

      <div class="controls">
        <button id="exportBtn" class="primary">Export CSV</button>
        <button id="resetBtn">Reset</button>
      </div>
    </aside>
  </main>
</div>

<script src="../shared/config.js"></script>
<script src="../shared/i18n.js"></script>
<script src="../shared/session.js"></script>
<script src="../shared/mousetracking.js"></script>
<script>
/* =============================================================
   TASK 1 — GOAL–TEMPTATION MOUSE-TRACKING
   Flow: instructions → practice trials → interstitial → main trials
         → (session: save + next page | standalone: done panel + CSV)
   Prompt condition (Session.cond): 'immediate' | 'goal' — one prompt
   per student across all trials. AUC & MD after Freeman & Ambady (2010).
   ============================================================= */

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const intParam = (name, dflt) => { const v = parseInt(qs.get(name), 10); return Number.isFinite(v) && v >= 0 ? v : dflt; };

const STIM_DIR = 'goal_temptation_stimuli';
const stim = key => ({ key, img: `${STIM_DIR}/${key}.png`, label: STIM_LABELS[key].en, caption: Session.pick(STIM_LABELS[key]) });
const PAIRS = [
  { goal: stim('01_complete_practice_problems'),   temptation: stim('02_watch_youtube_shorts') },
  { goal: stim('03_review_your_class_notes'),      temptation: stim('04_play_a_phone_game') },
  { goal: stim('05_study_with_digital_flashcards'), temptation: stim('06_watch_soccer_highlights') },
  { goal: stim('07_prepare_for_tomorrows_quiz'),   temptation: stim('08_group_chat_with_friends') },
  { goal: stim('09_work_on_homework_correction'),  temptation: stim('10_scroll_funny_memes') },
];
PAIRS.forEach(p => [p.goal.img, p.temptation.img].forEach(src => { const im = new Image(); im.src = src; }));

const N_PRACTICE = intParam('practice', CONFIG.TASK1_PRACTICE_TRIALS);
const N_REPEATS  = intParam('repeats',  CONFIG.TASK1_REPEATS);
const N_MAIN     = PAIRS.length * N_REPEATS;
const INIT_WARN_MS = CONFIG.TASK1_INIT_WARN_MS;
const MOVE_THRESHOLD_PX = 10;
const N_TIME_BINS = 101;
const REVIEW = Session.review;
const COND = Session.cond;
const PROMPT = Session.t(COND === 'immediate' ? 't1_prompt_immediate' : 't1_prompt_goal');

Session.applyI18n();
document.title = Session.t('t1_title');
$('prompt').textContent = PROMPT;
$('interPrompt').textContent = PROMPT;
$('practiceBadge').textContent = Session.t('t1_practice_badge');
$('stimulus').textContent = Session.t('t1_choose');
$('startBtn').textContent = Session.t('start');
$('condLabel').textContent = COND;
if (!REVIEW){ $('aside').classList.add('hidden'); $('main').classList.add('no-aside'); }

const state = {
  block: 'practice',   // practice | main
  order: [], sides: [],
  trials: [],          // main trials
  practice: [],        // practice trials
  current: null,
  stage: 'idle',       // idle | awaiting_start | in_trial | review | done
};

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* Trial list: each block is a shuffled pass over all pairs; goal side is
   balanced within each pass (half left / half right, shuffled). */
function buildOrder(nPasses, nTrials){
  const order = [], sides = [];
  while (order.length < nTrials){
    order.push(...shuffle(PAIRS.map((_, i) => i)));
    sides.push(...shuffle(PAIRS.map((_, i) => i % 2 === 0)));
  }
  return { order: order.slice(0, nTrials), sides: sides.slice(0, nTrials) };
}

const list = () => state.block === 'practice' ? state.practice : state.trials;
const total = () => state.block === 'practice' ? N_PRACTICE : N_MAIN;

function updateTrialLabel(){
  $('trialLabel').textContent = Session.t('t1_trial', { n: Math.min(list().length + 1, total()), total: total() });
}

function setupTrial(){
  if (list().length >= total()){
    if (state.block === 'practice') return showInterstitial();
    return finishTask();
  }
  const i = list().length;
  const pairIdx = state.order[i];
  const pair = PAIRS[pairIdx];
  const leftIsGoal = state.sides[i];
  const leftStim  = leftIsGoal ? pair.goal : pair.temptation;
  const rightStim = leftIsGoal ? pair.temptation : pair.goal;
  state.current = {
    isPractice: state.block === 'practice',
    trialIdx: i + 1, pairIdx,
    left: leftStim.label, right: rightStim.label,
    leftType:  leftIsGoal ? 'goal' : 'temptation',
    rightType: leftIsGoal ? 'temptation' : 'goal',
    pair, samples: [],
  };
  $('optLeftImg').src  = leftStim.img;  $('optLeftImg').alt  = leftStim.label;  $('optLeftCap').textContent  = leftStim.caption;
  $('optRightImg').src = rightStim.img; $('optRightImg').alt = rightStim.label; $('optRightCap').textContent = rightStim.caption;
  ['optLeft','optRight','stimulus','reviewCanvas','reviewBadge','reviewMeta','donePanel','nextBtn','warn']
    .forEach(id => $(id).classList.add('hidden'));
  $('optLeft').classList.remove('review');
  $('optRight').classList.remove('review');
  $('startBtn').classList.remove('hidden');
  updateTrialLabel();
  state.stage = 'awaiting_start';
}

/* ---------- screens ---------- */

$('introBtn').addEventListener('click', () => {
  $('intro').classList.add('hidden');
  $('main').classList.remove('hidden');
  Session.log('task1_start', { condition: COND, n_practice: N_PRACTICE, n_main: N_MAIN });
  startBlock('practice');
});

function startBlock(block){
  state.block = block;
  const n = total();
  Object.assign(state, buildOrder(Math.ceil(n / PAIRS.length), n));
  $('practiceBadge').classList.toggle('hidden', block !== 'practice');
  if (n === 0) return setupTrial();
  setupTrial();
}

function showInterstitial(){
  state.stage = 'idle';
  $('main').classList.add('hidden');
  $('interstitial').classList.remove('hidden');
}
$('interBtn').addEventListener('click', () => {
  $('interstitial').classList.add('hidden');
  $('main').classList.remove('hidden');
  startBlock('main');
});

/* ---------- trial flow ---------- */

$('startBtn').addEventListener('click', e => {
  if (state.stage !== 'awaiting_start') return;
  const c = state.current;
  c.stageRect = $('stage').getBoundingClientRect();
  c.startPos  = { x: e.clientX, y: e.clientY };
  c.startTime = performance.now();
  c.samples.push({ x: e.clientX, y: e.clientY, t: 0 });
  $('startBtn').classList.add('hidden');
  $('optLeft').classList.remove('hidden');
  $('optRight').classList.remove('hidden');
  $('stimulus').classList.remove('hidden');
  state.stage = 'in_trial';
});

document.addEventListener('mousemove', e => {
  if (state.stage !== 'in_trial') return;
  state.current.samples.push({ x: e.clientX, y: e.clientY, t: performance.now() - state.current.startTime });
});

function centerOf(el){ const r = el.getBoundingClientRect(); return { x: r.left + r.width/2, y: r.top + r.height/2 }; }

function pickOption(side, e){
  if (state.stage !== 'in_trial') return;
  const trial = state.current;
  trial.rt = performance.now() - trial.startTime;
  trial.samples.push({ x: e.clientX, y: e.clientY, t: trial.rt });   // true endpoint

  trial.leftPos    = centerOf($('optLeft'));
  trial.rightPos   = centerOf($('optRight'));
  trial.chosen     = side === 'left' ? trial.left     : trial.right;
  trial.chosenType = side === 'left' ? trial.leftType : trial.rightType;
  trial.chosenSide = side;
  trial.chosenPos  = side === 'left' ? trial.leftPos  : trial.rightPos;
  trial.otherPos   = side === 'left' ? trial.rightPos : trial.leftPos;

  trial.initTime = null;
  for (let i = 1; i < trial.samples.length; i++){
    if (Math.hypot(trial.samples[i].x - trial.startPos.x, trial.samples[i].y - trial.startPos.y) > MOVE_THRESHOLD_PX){
      trial.initTime = trial.samples[i].t; break;
    }
  }
  trial.slowStart = trial.initTime === null || trial.initTime > INIT_WARN_MS;

  const m = computeMetrics(trial.samples, trial.startPos, trial.chosenPos);
  Object.assign(trial, { auc: m.auc, md: m.md, xFlips: m.xFlips, normalized: m.normalized, mdIdx: m.mdIdx });

  list().push(trial);
  state.stage = 'review';
  $('optLeft').classList.add('review');
  $('optRight').classList.add('review');
  $('stimulus').classList.add('hidden');
  if (!trial.isPractice) updatePanels();

  if (REVIEW) return showReview(trial);

  // Participant mode: slow-start warning (doc §6) or straight on.
  if (trial.slowStart){
    $('warn').textContent = Session.t('t1_slow');
    $('warn').classList.remove('hidden');
    setTimeout(setupTrial, 1800);
  } else {
    setTimeout(setupTrial, 350);
  }
}
$('optLeft').addEventListener('click',  e => pickOption('left', e));
$('optRight').addEventListener('click', e => pickOption('right', e));
$('nextBtn').addEventListener('click', () => { if (state.stage === 'review') setupTrial(); });

/* ---------- researcher review ---------- */

function showReview(trial){
  $('reviewCanvas').classList.remove('hidden');
  $('reviewBadge').classList.remove('hidden');
  $('reviewMeta').classList.remove('hidden');
  $('nextBtn').classList.remove('hidden');
  $('nextBtn').textContent = list().length >= total() ? Session.t('continue_') : Session.t('next') + ' →';
  $('reviewMeta').innerHTML =
    `${trial.isPractice ? '<b>practice</b><br>' : ''}` +
    `chose <b>${trial.chosen}</b> (${trial.chosenType})<br>` +
    `AUC <b>${trial.auc.toFixed(3)}</b> · MD <b>${trial.md.toFixed(3)}</b><br>` +
    `x-flips ${trial.xFlips} · RT ${Math.round(trial.rt)} ms<br>` +
    `init ${trial.initTime !== null ? Math.round(trial.initTime) + ' ms' : '—'}` +
    (trial.slowStart ? ' <span style="color:var(--accent)">(slow)</span>' : '');
  if (trial.slowStart){ $('warn').textContent = Session.t('t1_slow'); $('warn').classList.remove('hidden'); }
  drawTrajectoryReview($('reviewCanvas'), $('stage'), trial);
}

function updatePanels(){
  const last = state.trials[state.trials.length - 1];
  if (!last) return;
  $('lastChoice').textContent = `${last.chosen} · ${last.chosenType}`;
  $('lastAUC').textContent    = last.auc.toFixed(3);
  $('lastMD').textContent     = last.md.toFixed(3);
  $('lastFlips').textContent  = last.xFlips;
  $('lastRT').textContent     = `${Math.round(last.rt)} ms`;
  $('lastInit').textContent   = last.initTime !== null ? `${Math.round(last.initTime)} ms` : '—';
  const n = state.trials.length;
  $('nTrials').textContent = n;
  const mean = arr => arr.reduce((s,v) => s+v, 0) / arr.length;
  $('meanAUC').textContent = mean(state.trials.map(t => t.auc)).toFixed(3);
  $('meanMD').textContent  = mean(state.trials.map(t => t.md)).toFixed(3);
  $('meanRT').textContent  = `${Math.round(mean(state.trials.map(t => t.rt)))} ms`;
}

/* ---------- data ---------- */

function trialRow(t){
  return {
    is_practice: t.isPractice, trial: t.trialIdx, pair: t.pairIdx + 1,
    goal: t.pair.goal.label, temptation: t.pair.temptation.label,
    left_option: t.left, right_option: t.right, left_type: t.leftType, right_type: t.rightType,
    chosen: t.chosen, chosen_type: t.chosenType, chosen_side: t.chosenSide,
    rt_ms: Math.round(t.rt), init_time_ms: t.initTime !== null ? Math.round(t.initTime) : '',
    slow_start: t.slowStart, auc: +t.auc.toFixed(6), md: +t.md.toFixed(6), x_flips: t.xFlips,
    n_samples: t.samples.length,
    stage_w: Math.round(t.stageRect.width), stage_h: Math.round(t.stageRect.height),
  };
}
/* One row per trial; the 101 time-normalized (x, y) samples are stored as
   JSON arrays (keeps the Google Sheet ~100× smaller than one row per bin). */
function trajectoryRow(t){
  return {
    is_practice: t.isPractice, trial: t.trialIdx, n_bins: N_TIME_BINS,
    x_norm: JSON.stringify(t.normalized.map(p => +p.x.toFixed(5))),
    y_norm: JSON.stringify(t.normalized.map(p => +p.y.toFixed(5))),
  };
}
/* Long format (one row per bin) for the standalone CSV export. */
function trajectoryRows(t){
  return t.normalized.map((p, si) => ({
    is_practice: t.isPractice, trial: t.trialIdx, sample_idx: si,
    t_norm: +(si / (N_TIME_BINS - 1)).toFixed(4), x_norm: +p.x.toFixed(6), y_norm: +p.y.toFixed(6),
  }));
}

async function finishTask(){
  state.stage = 'done';
  state.current = null;
  ['optLeft','optRight','stimulus','startBtn','reviewCanvas','reviewBadge','reviewMeta','nextBtn','warn']
    .forEach(id => $(id).classList.add('hidden'));
  $('donePanel').classList.remove('hidden');
  $('doneNote').textContent = Session.t('saving');
  const all = [...state.practice, ...state.trials];
  await Session.save({
    task1_trials: all.map(trialRow),
    task1_trajectories: all.map(trajectoryRow),
  }, 'task1');
  await Session.log('task1_complete', { condition: COND, n_main: state.trials.length });
  if (Session.standalone){
    $('doneNote').textContent = 'Standalone run — export the CSV or reset.';
  } else {
    Session.next('task1');
  }
}

/* ---------- standalone controls ---------- */

$('exportBtn').addEventListener('click', () => {
  const all = [...state.practice, ...state.trials];
  if (!all.length) return;
  const rows = all.flatMap(t => trajectoryRows(t).map(r => ({ ...trialRow(t), ...r })));
  Session.download(`task1_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`, Session.csvOf(rows));
});
$('resetBtn').addEventListener('click', () => {
  if (state.trials.length > 0 && !confirm('Clear all recorded trials?')) return;
  state.trials = []; state.practice = [];
  ['lastChoice','lastAUC','lastMD','lastFlips','lastRT','lastInit','meanAUC','meanMD','meanRT'].forEach(id => $(id).textContent = '—');
  $('nTrials').textContent = '0';
  startBlock('practice');
});

updateTrialLabel();
</script>
</body>
</html>
