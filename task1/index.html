<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game 1</title>
<link rel="stylesheet" href="../shared/activity.css?v=202610301550">
<link rel="stylesheet" href="../shared/dragcursor.css?v=202610301550">
<style>
  :root {
    --bg:     #f4efe4;
    --panel:  #ece5d3;
    --ink:    #1f1e2c;
    --soft:   #7a7587;
    --accent: #a8324a;
    --rule:   #d8cfb6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  header {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding-bottom: 10px; margin-bottom: 16px;
    border-bottom: 1px solid var(--ink);
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.01em; line-height: 1.4; }
  header .trial { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--soft); white-space: nowrap; }
  header .trial b { color: var(--ink); font-weight: 600; }
  header .badge {
    display: inline-block; margin-right: 10px; padding: 3px 8px;
    background: var(--accent); color: var(--bg);
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    vertical-align: middle;
  }

  /* intro / interstitial cards */
  .intro {
    max-width: 640px; margin: 40px auto;
    background: var(--panel); border: 1px solid var(--ink);
    padding: 32px 36px;
  }
  .intro h2 { font-size: 20px; margin-bottom: 16px; }
  .intro p  { font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
  .intro .stem { margin-top: 18px; padding: 12px 14px; background: var(--bg); border-left: 3px solid var(--accent); font-weight: 600; }
  .intro .big-btn {
    display: block; margin: 24px auto 0;
    padding: 12px 40px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--bg);
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
  }
  .intro .big-btn:hover { opacity: 0.9; }

  main {
    display: grid; grid-template-columns: minmax(0,1fr) 260px;
    gap: 16px; align-items: start;
  }
  main.no-aside { grid-template-columns: minmax(0,1fr); max-width: 900px; margin: 0 auto; }

  .stage {
    position: relative; aspect-ratio: 4/3;
    background: var(--panel); border: 1px solid var(--ink);
    overflow: hidden; user-select: none;
  }

  .option {
    position: absolute; top: 3%;
    display: block; padding: 4px;
    background: #fff; border: 1px solid var(--ink);
    cursor: pointer; font-family: inherit;
    transition: box-shadow 0.12s ease;
    width: 31%;
  }
  .option .pic { pointer-events: none; }
  .option .cap {
    display: block; margin-top: 4px; font-size: 13px; line-height: 1.3;
    font-weight: 600; color: var(--ink); text-align: center;
    pointer-events: none;
  }
  .option .cap:empty { display: none; }
  .option:hover { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
  .option.opt-left  { left: 3%; }
  .option.opt-right { right: 3%; }
  .option.review { pointer-events: none; cursor: default; }

  .stage-btn {
    position: absolute; left: 50%; transform: translateX(-50%);
    padding: 12px 30px; border: 1px solid var(--ink);
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
  }
  .start-btn { bottom: 4%; background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .next-btn  { bottom: 20px; background: var(--accent); color: var(--bg); border-color: var(--accent); z-index: 3; }
  .stage-btn:hover { opacity: 0.9; }

  .warn {
    position: absolute; top: 62%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
    background: var(--accent); color: var(--bg);
    padding: 16px 24px; font-size: 16px; font-weight: 600; text-align: center;
    max-width: 70%; z-index: 4;
  }

  .review-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  .review-badge {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: var(--bg);
    padding: 5px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    z-index: 3;
  }
  .done-panel {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 3;
  }
  .done-panel h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .done-panel p  { font-size: 13px; color: var(--soft); }
  .review-meta {
    position: absolute; top: 230px; left: 10px;
    background: rgba(244, 239, 228, 0.92);
    border: 1px solid var(--ink);
    padding: 8px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; line-height: 1.55;
    z-index: 3;
  }
  .review-meta b { color: var(--accent); }

  .hidden { display: none !important; }

  aside { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--bg); border: 1px solid var(--ink);
    padding: 12px 14px;
  }
  .card h3 {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--soft);
    padding-bottom: 6px; margin-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  dl.metrics {
    display: grid; grid-template-columns: auto 1fr;
    gap: 4px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  dl.metrics dt { color: var(--soft); }
  dl.metrics dd { text-align: right; font-weight: 500; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .controls button {
    padding: 9px 8px; border: 1px solid var(--ink);
    background: var(--bg); cursor: pointer; font-family: inherit;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .controls button.primary { background: var(--ink); color: var(--bg); }
  .controls button:hover { opacity: 0.85; }

  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">

  <header class="hidden" id="topBar">
    <h1><span class="badge hidden" id="practiceBadge"></span><span id="prompt"></span></h1>
    <span class="trial" id="trialLabel"></span>
  </header>

  <!-- instructions -->
  <!-- instructions, screen 1 (team doc 界面1) -->
  <section class="intro" id="intro">
    <h2 data-i18n="t1_title"></h2>
    <div id="instr"></div>
    <button class="big-btn" id="instrNext" data-i18n="next"></button>
  </section>

  <!-- instructions, screen 2 (界面2): practice line + the question -->
  <section class="intro hidden" id="intro2">
    <p><b data-i18n="t1_practice_intro"></b></p>
    <p class="stem" id="introPrompt"></p>
    <button class="big-btn" id="introBtn" data-i18n="start"></button>
  </section>

  <!-- practice → main interstitial -->
  <section class="intro hidden" id="interstitial">
    <p><b data-i18n="t1_practice_done"></b></p>
    <p id="interPrompt"></p>
    <button class="big-btn" id="interBtn" data-i18n="continue_"></button>
  </section>

  <main class="hidden" id="main">
    <div class="stage" id="stage">
      <button class="option opt-left hidden" id="optLeft">
        <span id="optLeftPic"></span>
        <span class="cap" id="optLeftCap"></span>
      </button>
      <button class="option opt-right hidden" id="optRight">
        <span id="optRightPic"></span>
        <span class="cap" id="optRightCap"></span>
      </button>
      <button class="stage-btn start-btn"     id="startBtn"></button>
      <div    class="warn hidden"             id="warn"></div>
      <canvas class="review-canvas hidden"    id="reviewCanvas"></canvas>
      <div    class="review-badge hidden"     id="reviewBadge">Researcher view</div>
      <div    class="review-meta hidden"      id="reviewMeta"></div>
      <div    class="done-panel hidden"       id="donePanel">
        <h2 data-i18n="t1_done"></h2>
        <p id="doneNote"></p>
      </div>
      <button class="stage-btn next-btn hidden" id="nextBtn"></button>
    </div>

    <aside id="aside">
      <div class="card">
        <h3>Last trial</h3>
        <dl class="metrics">
          <dt>chose</dt>   <dd id="lastChoice">—</dd>
          <dt>AUC</dt>     <dd id="lastAUC">—</dd>
          <dt>MD</dt>      <dd id="lastMD">—</dd>
          <dt>x-flips</dt> <dd id="lastFlips">—</dd>
          <dt>RT</dt>      <dd id="lastRT">—</dd>
          <dt>init</dt>    <dd id="lastInit">—</dd>
          <dt>samples</dt> <dd id="lastN">—</dd>
        </dl>
      </div>

      <div class="card">
        <h3>Aggregate · n=<span id="nTrials">0</span></h3>
        <dl class="metrics">
          <dt>version</dt>  <dd id="condLabel">—</dd>
          <dt>mean AUC</dt> <dd id="meanAUC">—</dd>
          <dt>mean MD</dt>  <dd id="meanMD">—</dd>
          <dt>mean RT</dt>  <dd id="meanRT">—</dd>
        </dl>
      </div>

      <div class="controls">
        <button id="exportBtn" class="primary">Export CSV</button>
        <button id="resetBtn">Reset</button>
      </div>
    </aside>
  </main>
</div>

<script src="../shared/config.js?v=202610301550"></script>
<script src="../shared/i18n.js?v=202610301550"></script>
<script src="../shared/videos.js?v=202610301550"></script>
<script src="../shared/stimuli.js?v=202610301550"></script>
<script src="../shared/session.js?v=202610301550"></script>
<script src="../shared/mousetracking.js?v=202610301550"></script>
<script src="../shared/dragcursor.js?v=202610301550"></script>
<script>
/* =============================================================
   TASK 1 — GOAL–TEMPTATION MOUSE-TRACKING
   Flow: instructions → practice trials → interstitial → main trials
         → (session: save + next page | standalone: done panel + CSV)
   Main trials: TASK1_TRIAL_LIST (shared/stimuli.js), one fixed order of
   60 (30 goal–temptation + 30 goal–neutral, sides balanced; ?trials=N runs
   the first N).
   Practice: TASK1_PRACTICE_LIST, 3 fixed study-vs-other pairs (not scored).
   Prompt version (Session.mt): 'A' choose now | 'B' helps on the quiz —
   one per student across all trials.
   Cursor: sampled at a fixed rate (CONFIG.TASK1_SAMPLE_MS) from the moment
   the options appear until the choice, including still periods. If the
   cursor hasn't moved by CONFIG.TASK1_INIT_WARN_MS, the "start moving
   sooner" reminder appears (warning_shown = 1). AUC / MD / x-flips:
   shared/mousetracking.js.
   Saving: rows are uploaded every CONFIG.TASK1_SAVE_EVERY trials, so a
   student who leaves midway keeps the trials already done.
   ============================================================= */

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const intParam = (name, dflt) => { const v = parseInt(qs.get(name), 10); return Number.isFinite(v) && v >= 0 ? v : dflt; };

const TYPE_OF = { study: 'goal', entertainment: 'temptation', neutral: 'neutral' };
const N_PRACTICE = intParam('practice', CONFIG.TASK1_PRACTICE_TRIALS);
const N_MAIN     = Math.min(intParam('trials', TASK1_TRIAL_LIST.length), TASK1_TRIAL_LIST.length);
const INIT_WARN_MS = CONFIG.TASK1_INIT_WARN_MS;
const SAMPLE_MS = CONFIG.TASK1_SAMPLE_MS;
const MOVE_THRESHOLD_PX = CONFIG.TASK1_MOVE_THRESHOLD_PX;
const N_TIME_BINS = 101;
const REVIEW = Session.review;
const VERSION = Session.mt;     // 'A' | 'B'
const PROMPT = Session.t('t1_prompt_' + VERSION);
const TOUCH_UI = matchMedia('(hover: none)').matches;

ACTIVITIES.forEach(a => { const im = new Image(); im.src = activityImgSrc(a); });

Session.applyI18n();
document.title = Session.t('t1_title');
$('instr').innerHTML = ['t1_i1', 't1_i2', 't1_i3_' + VERSION, 't1_i4', TOUCH_UI ? 't1_i5_touch' : 't1_i5', 't1_i6_' + VERSION, 't1_i7']
  .map(k => `<p>${Session.t(k)}</p>`).join('');
$('prompt').textContent = PROMPT;
$('introPrompt').textContent = PROMPT;
$('interPrompt').textContent = PROMPT;
$('practiceBadge').textContent = Session.t('t1_practice_badge');
$('startBtn').textContent = Session.t('start');
$('condLabel').textContent = VERSION;
if (!REVIEW){ $('aside').classList.add('hidden'); $('main').classList.add('no-aside'); }

const state = {
  block: 'practice',   // practice | main
  plan: [],            // [{ trial_id, trial_type, left, right }], one per trial
  trials: [],          // main trials
  practice: [],        // practice trials
  unsaved: [],         // finished trials not yet uploaded
  current: null,
  stage: 'idle',       // idle | awaiting_start | in_trial | review | done
};
const sampler = createSampler(SAMPLE_MS, MOVE_THRESHOLD_PX);
let warnTimer = null;

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function buildPlan(block, n){
  if (block === 'main') return TASK1_TRIAL_LIST.slice(0, n);
  return Array.from({ length: n }, (_, i) => TASK1_PRACTICE_LIST[i % TASK1_PRACTICE_LIST.length]);
}

const list = () => state.block === 'practice' ? state.practice : state.trials;
const total = () => state.block === 'practice' ? N_PRACTICE : N_MAIN;

function updateTrialLabel(){
  $('trialLabel').textContent = Session.t('t1_trial', { n: Math.min(list().length + 1, total()), total: total() });
}

function setupTrial(){
  if (list().length >= total()){
    if (state.block === 'practice') return showInterstitial();
    return finishTask();
  }
  const i = list().length;
  const p = state.plan[i];
  state.current = {
    isPractice: state.block === 'practice',
    trialIdx: i + 1, trialId: p.trial_id, trialType: p.trial_type,
    sourceTrial: p.source_trial ?? '', sideSwapped: p.side_swapped === undefined ? '' : +p.side_swapped,
    leftAct: p.left, rightAct: p.right,
    leftType: TYPE_OF[p.left.cat], rightType: TYPE_OF[p.right.cat],
    warningShown: 0,
  };
  $('optLeftPic').innerHTML  = activityPic(p.left);  $('optLeftCap').textContent  = activityCaption(p.left);
  $('optRightPic').innerHTML = activityPic(p.right); $('optRightCap').textContent = activityCaption(p.right);
  ['optLeft','optRight','reviewCanvas','reviewBadge','reviewMeta','donePanel','nextBtn','warn']
    .forEach(id => $(id).classList.add('hidden'));
  drag.reset();
  $('optLeft').classList.remove('review');
  $('optRight').classList.remove('review');
  $('startBtn').classList.remove('hidden');
  updateTrialLabel();
  state.stage = 'awaiting_start';
}

/* ---------- screens ---------- */

$('instrNext').addEventListener('click', () => {
  $('intro').classList.add('hidden');
  $('intro2').classList.remove('hidden');
  window.scrollTo(0, 0);
});
$('introBtn').addEventListener('click', () => {
  $('intro2').classList.add('hidden');
  $('topBar').classList.remove('hidden');
  $('main').classList.remove('hidden');
  Session.log('task1_start', { mt_version: VERSION, n_practice: N_PRACTICE, n_main: N_MAIN });
  Session.status('task1', 'not_completed', { n_planned: N_MAIN });
  startBlock('practice');
});

function startBlock(block){
  state.block = block;
  state.plan = buildPlan(block, total());
  $('practiceBadge').classList.toggle('hidden', block !== 'practice');
  setupTrial();
}

function showInterstitial(){
  state.stage = 'idle';
  $('main').classList.add('hidden');
  $('interstitial').classList.remove('hidden');
}
$('interBtn').addEventListener('click', () => {
  $('interstitial').classList.add('hidden');
  $('main').classList.remove('hidden');
  startBlock('main');
});

/* ---------- trial flow ---------- */

/* Start a trial from a START press: the options appear (t = 0) and the
   fixed-rate sampler starts. inputType: 'mouse' (click, cursor tracked by
   mousemove) or, via the drag cursor, 'touch' / 'pen' / 'mouse_drag'. */
function startTrial(e, inputType = 'mouse'){
  if (state.stage !== 'awaiting_start') return false;
  const c = state.current;
  c.inputType = inputType;
  c.stageRect = $('stage').getBoundingClientRect();
  c.startPos  = { x: e.clientX, y: e.clientY };
  $('startBtn').classList.add('hidden');
  $('optLeft').classList.remove('hidden');
  $('optRight').classList.remove('hidden');
  sampler.start(e.clientX, e.clientY);
  clearTimeout(warnTimer);
  warnTimer = setTimeout(() => {
    if (state.stage !== 'in_trial' || sampler.firstMoveT !== null) return;
    c.warningShown = 1;
    $('warn').textContent = Session.t('t1_slow');
    $('warn').classList.remove('hidden');
  }, INIT_WARN_MS);
  state.stage = 'in_trial';
  return true;
}
$('startBtn').addEventListener('click', e => startTrial(e));

document.addEventListener('mousemove', e => {
  if (state.stage !== 'in_trial' || drag.active) return;
  sampler.move(e.clientX, e.clientY);
});
const drag = DragCursor.create({
  stage: $('stage'), startBtn: $('startBtn'), targets: [$('optLeft'), $('optRight')],
  hint: Session.t('drag_hint'),
  onStart: startTrial,
  onMove: (x, y) => { if (state.stage === 'in_trial') sampler.move(x, y); },
  onDrop: (i, e) => pickOption(i === 0 ? 'left' : 'right', e),
});

function centerOf(el){ const r = el.getBoundingClientRect(); return { x: r.left + r.width/2, y: r.top + r.height/2 }; }

function pickOption(side, e){
  if (state.stage !== 'in_trial') return;
  const trial = state.current;
  trial.rt = sampler.stop(e.clientX, e.clientY);       // last sample = the choice point
  trial.samples = sampler.samples;
  trial.initTime = sampler.firstMoveT;
  clearTimeout(warnTimer);
  $('warn').classList.add('hidden');

  trial.leftPos    = centerOf($('optLeft'));
  trial.rightPos   = centerOf($('optRight'));
  trial.chosenAct  = side === 'left' ? trial.leftAct  : trial.rightAct;
  trial.chosenType = side === 'left' ? trial.leftType : trial.rightType;
  trial.chosenSide = side;
  trial.chosenPos  = side === 'left' ? trial.leftPos  : trial.rightPos;

  const m = computeMetrics(trial.samples, trial.startPos, trial.chosenPos);
  Object.assign(trial, { auc: m.auc, md: m.md, xFlips: m.xFlips, normalized: m.normalized, mdIdx: m.mdIdx });

  list().push(trial);
  queueSave(trial);
  state.stage = 'review';
  $('optLeft').classList.add('review');
  $('optRight').classList.add('review');
  if (!trial.isPractice) updatePanels();

  if (REVIEW) return showReview(trial);
  setTimeout(setupTrial, 350);
}
$('optLeft').addEventListener('click',  e => pickOption('left', e));
$('optRight').addEventListener('click', e => pickOption('right', e));
$('nextBtn').addEventListener('click', () => { if (state.stage === 'review') setupTrial(); });

/* ---------- researcher review ---------- */

function showReview(trial){
  $('reviewCanvas').classList.remove('hidden');
  $('reviewBadge').classList.remove('hidden');
  $('reviewMeta').classList.remove('hidden');
  $('nextBtn').classList.remove('hidden');
  $('nextBtn').textContent = list().length >= total() ? Session.t('continue_') : Session.t('next') + ' →';
  $('reviewMeta').innerHTML =
    `${trial.isPractice ? '<b>practice</b>' : `trial <b>${trial.trialId}</b> · ${trial.trialType}`}<br>` +
    `chose <b>${trial.chosenAct.en}</b> (${trial.chosenType})<br>` +
    `AUC <b>${trial.auc.toFixed(3)}</b> · MD <b>${trial.md.toFixed(3)}</b><br>` +
    `x-flips ${trial.xFlips} · RT ${Math.round(trial.rt)} ms<br>` +
    `init ${trial.initTime !== null ? Math.round(trial.initTime) + ' ms' : '—'}` +
    (trial.warningShown ? ' <span style="color:var(--accent)">(warned)</span>' : '') +
    `<br>${trial.samples.length} samples`;
  drawTrajectoryReview($('reviewCanvas'), $('stage'), trial);
}

function updatePanels(){
  const last = state.trials[state.trials.length - 1];
  if (!last) return;
  $('lastChoice').textContent = `${last.chosenAct.en} · ${last.chosenType}`;
  $('lastAUC').textContent    = last.auc.toFixed(3);
  $('lastMD').textContent     = last.md.toFixed(3);
  $('lastFlips').textContent  = last.xFlips;
  $('lastRT').textContent     = `${Math.round(last.rt)} ms`;
  $('lastInit').textContent   = last.initTime !== null ? `${Math.round(last.initTime)} ms` : '—';
  $('lastN').textContent      = last.samples.length;
  const n = state.trials.length;
  $('nTrials').textContent = n;
  const mean = arr => arr.reduce((s,v) => s+v, 0) / arr.length;
  $('meanAUC').textContent = mean(state.trials.map(t => t.auc)).toFixed(3);
  $('meanMD').textContent  = mean(state.trials.map(t => t.md)).toFixed(3);
  $('meanRT').textContent  = `${Math.round(mean(state.trials.map(t => t.rt)))} ms`;
}

/* ---------- data ---------- */

/* Positions are saved in px relative to the stage's top-left corner. */
const local = (t, p) => ({ x: Math.round(p.x - t.stageRect.left), y: Math.round(p.y - t.stageRect.top) });

function trialRow(t){
  const goal  = [t.leftAct, t.rightAct].find(a => a.cat === 'study');
  const other = goal ? [t.leftAct, t.rightAct].find(a => a !== goal) : null;
  const st = local(t, t.startPos), lp = local(t, t.leftPos), rp = local(t, t.rightPos);
  return {
    block: t.isPractice ? 'practice' : 'main', trial: t.trialIdx, trial_id: t.trialId, trial_type: t.trialType,
    source_trial: t.sourceTrial, side_swapped: t.sideSwapped,
    mt_prompt: PROMPT,
    left_id: t.leftAct.id, right_id: t.rightAct.id,
    left_image: activityImgFile(t.leftAct), right_image: activityImgFile(t.rightAct),
    left_type: t.leftType, right_type: t.rightType,
    goal_id: goal?.id ?? '', other_id: other?.id ?? '',
    goal_side: goal ? (goal === t.leftAct ? 'left' : 'right') : '',
    chosen_id: t.chosenAct.id, chosen_side: t.chosenSide, chosen_type: t.chosenType,
    chose_goal: goal ? +(t.chosenAct === goal) : '',
    rt_ms: Math.round(t.rt),
    initiation_time: t.initTime !== null ? Math.round(t.initTime) : '',
    warning_shown: t.warningShown, init_warn_ms: INIT_WARN_MS,
    input_type: t.inputType,
    auc: +t.auc.toFixed(6), md: +t.md.toFixed(6), x_flips: t.xFlips,
    n_samples: t.samples.length, sample_ms: SAMPLE_MS,
    stage_w: Math.round(t.stageRect.width), stage_h: Math.round(t.stageRect.height),
    start_x: st.x, start_y: st.y, left_x: lp.x, left_y: lp.y, right_x: rp.x, right_y: rp.y,
  };
}
/* One row per trial. Raw fixed-rate samples (t ms from the options
   appearing, x/y px in the stage) and the 101 time-normalized bins, each
   as a JSON array (keeps the Google Sheet small). */
function trajectoryRow(t){
  const pts = t.samples.map(p => local(t, p));
  return {
    block: t.isPractice ? 'practice' : 'main', trial: t.trialIdx, trial_id: t.trialId,
    n_samples: t.samples.length, sample_ms: SAMPLE_MS,
    t_ms: JSON.stringify(t.samples.map(p => Math.round(p.t))),
    x: JSON.stringify(pts.map(p => p.x)),
    y: JSON.stringify(pts.map(p => p.y)),
    n_bins: N_TIME_BINS,
    x_norm: JSON.stringify(t.normalized.map(p => +p.x.toFixed(5))),
    y_norm: JSON.stringify(t.normalized.map(p => +p.y.toFixed(5))),
  };
}
/* Long format (one row per raw sample) for the standalone CSV export. */
function sampleRows(t){
  return t.samples.map((p, si) => { const q = local(t, p); return { sample_idx: si, t_ms: Math.round(p.t), x: q.x, y: q.y }; });
}

function queueSave(trial){
  state.unsaved.push(trial);
  if (state.unsaved.length >= CONFIG.TASK1_SAVE_EVERY) flushTrials();
}
function flushTrials(){
  if (!state.unsaved.length) return Promise.resolve();
  const batch = state.unsaved; state.unsaved = [];
  return Session.save({ task1_trials: batch.map(trialRow), task1_trajectories: batch.map(trajectoryRow) }, 'task1');
}
// Leaving midway (tab closed, page reloaded): send what's left.
window.addEventListener('pagehide', () => { if (state.stage !== 'done') flushTrials(); });

async function finishTask(){
  state.stage = 'done';
  state.current = null;
  ['optLeft','optRight','startBtn','reviewCanvas','reviewBadge','reviewMeta','nextBtn','warn']
    .forEach(id => $(id).classList.add('hidden'));
  drag.reset();
  $('donePanel').classList.remove('hidden');
  $('doneNote').textContent = Session.t('saving');
  await flushTrials();
  await Session.status('task1', 'completed', { n_planned: N_MAIN, n_done: state.trials.length });
  await Session.log('task1_complete', { mt_version: VERSION, n_main: state.trials.length });
  if (Session.standalone){
    $('doneNote').textContent = 'Standalone run — export the CSV or reset.';
  } else {
    Session.next('task1');
  }
}

/* ---------- standalone controls ---------- */

$('exportBtn').addEventListener('click', () => {
  const all = [...state.practice, ...state.trials];
  if (!all.length) return;
  const rows = all.flatMap(t => sampleRows(t).map(r => ({ ...trialRow(t), ...r })));
  Session.download(`task1_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`, Session.csvOf(rows));
});
$('resetBtn').addEventListener('click', () => {
  if (state.trials.length > 0 && !confirm('Clear all recorded trials?')) return;
  state.trials = []; state.practice = []; state.unsaved = [];
  ['lastChoice','lastAUC','lastMD','lastFlips','lastRT','lastInit','lastN','meanAUC','meanMD','meanRT'].forEach(id => $(id).textContent = '—');
  $('nTrials').textContent = '0';
  startBlock('practice');
});

updateTrialLabel();
</script>
