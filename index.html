<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goal–Temptation Mouse-tracking</title>
<style>
  :root {
    --bg:     #f4efe4;
    --panel:  #ece5d3;
    --ink:    #1f1e2c;
    --soft:   #7a7587;
    --accent: #a8324a;
    --rule:   #d8cfb6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 10px; margin-bottom: 16px;
    border-bottom: 1px solid var(--ink);
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
  header .trial { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--soft); }
  header .trial b { color: var(--ink); font-weight: 600; }

  main {
    display: grid; grid-template-columns: minmax(0,1fr) 260px;
    gap: 16px; align-items: start;
  }

  .stage {
    position: relative; aspect-ratio: 4/3;
    background: var(--panel); border: 1px solid var(--ink);
    overflow: hidden; user-select: none;
  }

  .option {
    position: absolute; top: 22px;
    display: block; padding: 6px;
    background: var(--bg); border: 1px solid var(--ink);
    cursor: pointer; font-family: inherit;
    transition: box-shadow 0.12s ease;
  }
  .option img {
    display: block;
    width: 150px; height: 150px;
    pointer-events: none;
  }
  .option:hover { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
  .option.opt-left  { left: 22px; }
  .option.opt-right { right: 22px; }
  .option.review { pointer-events: none; cursor: default; }

  .stimulus {
    position: absolute; top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--soft);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .stage-btn {
    position: absolute; left: 50%; transform: translateX(-50%);
    padding: 10px 26px; border: 1px solid var(--ink);
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
  }
  .start-btn { bottom: 30px; background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .next-btn  { bottom: 20px; background: var(--accent); color: var(--bg); border-color: var(--accent); z-index: 3; }
  .stage-btn:hover { opacity: 0.9; }

  .review-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  .review-badge {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: var(--bg);
    padding: 5px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    z-index: 3;
  }
  .done-panel {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 3;
  }
  .done-panel h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .done-panel p  { font-size: 13px; color: var(--soft); }
  .review-meta {
    position: absolute; top: 210px; left: 10px;
    background: rgba(244, 239, 228, 0.92);
    border: 1px solid var(--ink);
    padding: 8px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; line-height: 1.55;
    z-index: 3;
  }
  .review-meta b { color: var(--accent); }

  .hidden { display: none !important; }

  aside { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--bg); border: 1px solid var(--ink);
    padding: 12px 14px;
  }
  .card h3 {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--soft);
    padding-bottom: 6px; margin-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  dl.metrics {
    display: grid; grid-template-columns: auto 1fr;
    gap: 4px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  dl.metrics dt { color: var(--soft); }
  dl.metrics dd { text-align: right; font-weight: 500; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .controls button {
    padding: 9px 8px; border: 1px solid var(--ink);
    background: var(--bg); cursor: pointer; font-family: inherit;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .controls button.primary { background: var(--ink); color: var(--bg); }
  .controls button:hover { opacity: 0.85; }

  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Goal–Temptation mouse-tracking</h1>
    <span class="trial">trial <b id="trialNum">—</b> / <b id="trialTotal">5</b></span>
  </header>

  <main>
    <div class="stage" id="stage">
      <button class="option opt-left hidden" id="optLeft">
        <img id="optLeftImg" alt="" draggable="false">
      </button>
      <button class="option opt-right hidden" id="optRight">
        <img id="optRightImg" alt="" draggable="false">
      </button>
      <div    class="stimulus hidden"         id="stimulus">choose</div>
      <button class="stage-btn start-btn"     id="startBtn">Start</button>
      <canvas class="review-canvas hidden"    id="reviewCanvas"></canvas>
      <div    class="review-badge hidden"     id="reviewBadge">Researcher view</div>
      <div    class="review-meta hidden"      id="reviewMeta"></div>
      <div    class="done-panel hidden"       id="donePanel">
        <h2>Session complete</h2>
        <p>All 5 trials recorded. Export the CSV or reset to run again.</p>
      </div>
      <button class="stage-btn next-btn hidden" id="nextBtn">Next →</button>
    </div>

    <aside>
      <div class="card">
        <h3>Last trial</h3>
        <dl class="metrics">
          <dt>chose</dt>   <dd id="lastChoice">—</dd>
          <dt>AUC</dt>     <dd id="lastAUC">—</dd>
          <dt>MD</dt>      <dd id="lastMD">—</dd>
          <dt>x-flips</dt> <dd id="lastFlips">—</dd>
          <dt>RT</dt>      <dd id="lastRT">—</dd>
          <dt>init</dt>    <dd id="lastInit">—</dd>
        </dl>
      </div>

      <div class="card">
        <h3>Aggregate · n=<span id="nTrials">0</span></h3>
        <dl class="metrics">
          <dt>mean AUC</dt> <dd id="meanAUC">—</dd>
          <dt>mean MD</dt>  <dd id="meanMD">—</dd>
          <dt>mean RT</dt>  <dd id="meanRT">—</dd>
        </dl>
      </div>

      <div class="controls">
        <button id="exportBtn" class="primary">Export CSV</button>
        <button id="resetBtn">Reset</button>
      </div>
    </aside>
  </main>
</div>

<script>
/* =============================================================
   GOAL–TEMPTATION MOUSE-TRACKING — 5-trial session with per-trial
   researcher review. AUC & MD after Freeman & Ambady (2010).
   ============================================================= */

const STIM_DIR = 'goal_temptation_stimuli';
const PAIRS = [
  { goal: { label: "Complete practice problems",   img: `${STIM_DIR}/01_complete_practice_problems.png` },
    temptation: { label: "Watch YouTube Shorts",   img: `${STIM_DIR}/02_watch_youtube_shorts.png` } },
  { goal: { label: "Review your class notes",      img: `${STIM_DIR}/03_review_your_class_notes.png` },
    temptation: { label: "Play a phone game",      img: `${STIM_DIR}/04_play_a_phone_game.png` } },
  { goal: { label: "Study with digital flashcards", img: `${STIM_DIR}/05_study_with_digital_flashcards.png` },
    temptation: { label: "Watch soccer highlights", img: `${STIM_DIR}/06_watch_soccer_highlights.png` } },
  { goal: { label: "Prepare for tomorrow's quiz",  img: `${STIM_DIR}/07_prepare_for_tomorrows_quiz.png` },
    temptation: { label: "Group chat with friends", img: `${STIM_DIR}/08_group_chat_with_friends.png` } },
  { goal: { label: "Work on your science worksheet", img: `${STIM_DIR}/09_work_on_homework_correction.png` },
    temptation: { label: "Scroll funny memes",     img: `${STIM_DIR}/10_scroll_funny_memes.png` } },
];
const N_TRIALS = PAIRS.length;

// Preload icons so options appear instantly at trial start
PAIRS.forEach(p => [p.goal.img, p.temptation.img].forEach(src => {
  const im = new Image(); im.src = src;
}));

const INIT_WARN_MS = 500;
const MOVE_THRESHOLD_PX = 10;
const N_TIME_BINS = 101;

const $ = id => document.getElementById(id);

const state = {
  order: [],       // shuffled pair indices for this session
  sides: [],       // per-trial goal placement (true = goal on left), balanced
  trials: [],
  current: null,
  stage: 'idle',   // idle | awaiting_start | in_trial | review | done
};

/* ---------- setup ---------- */

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setupTrial(){
  if (state.trials.length >= N_TRIALS){
    showDone();
    return;
  }
  const pairIdx = state.order[state.trials.length];
  const pair = PAIRS[pairIdx];
  const leftIsGoal = state.sides[state.trials.length];
  const leftStim  = leftIsGoal ? pair.goal : pair.temptation;
  const rightStim = leftIsGoal ? pair.temptation : pair.goal;
  state.current = {
    pairIdx,
    left:      leftStim.label,
    right:     rightStim.label,
    leftType:  leftIsGoal ? 'goal'       : 'temptation',
    rightType: leftIsGoal ? 'temptation' : 'goal',
    pair,
    samples: [],
  };
  $('optLeftImg').src  = leftStim.img;
  $('optLeftImg').alt  = leftStim.label;
  $('optRightImg').src = rightStim.img;
  $('optRightImg').alt = rightStim.label;
  $('optLeft').classList.add('hidden');
  $('optRight').classList.add('hidden');
  $('optLeft').classList.remove('review');
  $('optRight').classList.remove('review');
  $('stimulus').classList.add('hidden');
  $('startBtn').classList.remove('hidden');
  $('reviewCanvas').classList.add('hidden');
  $('reviewBadge').classList.add('hidden');
  $('reviewMeta').classList.add('hidden');
  $('donePanel').classList.add('hidden');
  $('nextBtn').classList.add('hidden');
  $('trialNum').textContent = state.trials.length + 1;
  state.stage = 'awaiting_start';
}

function showDone(){
  state.current = null;
  ['optLeft','optRight','stimulus','startBtn','reviewCanvas',
   'reviewBadge','reviewMeta','nextBtn'].forEach(id => $(id).classList.add('hidden'));
  $('donePanel').classList.remove('hidden');
  $('trialNum').textContent = N_TRIALS;
  state.stage = 'done';
}

/* ---------- trial flow ---------- */

$('startBtn').addEventListener('click', e => {
  if (state.stage !== 'awaiting_start') return;
  const c = state.current;
  c.stageRect = $('stage').getBoundingClientRect();
  c.startPos  = { x: e.clientX, y: e.clientY };
  c.startTime = performance.now();
  c.samples.push({ x: e.clientX, y: e.clientY, t: 0 });

  $('startBtn').classList.add('hidden');
  $('optLeft').classList.remove('hidden');
  $('optRight').classList.remove('hidden');
  $('stimulus').classList.remove('hidden');
  state.stage = 'in_trial';
});

document.addEventListener('mousemove', e => {
  if (state.stage !== 'in_trial') return;
  const t = performance.now() - state.current.startTime;
  state.current.samples.push({ x: e.clientX, y: e.clientY, t });
});

function pickOption(side, e){
  if (state.stage !== 'in_trial') return;
  const trial = state.current;
  trial.rt = performance.now() - trial.startTime;
  // Record the click position as the trajectory's true endpoint — the
  // idealized line (per Freeman & Ambady, 2010) runs start → endpoint.
  trial.samples.push({ x: e.clientX, y: e.clientY, t: trial.rt });

  trial.leftPos    = centerOf($('optLeft'));
  trial.rightPos   = centerOf($('optRight'));
  trial.chosen     = side === 'left' ? trial.left     : trial.right;
  trial.chosenType = side === 'left' ? trial.leftType : trial.rightType;
  trial.chosenSide = side;
  trial.chosenPos  = side === 'left' ? trial.leftPos  : trial.rightPos;
  trial.otherPos   = side === 'left' ? trial.rightPos : trial.leftPos;

  trial.initTime = null;
  for (let i = 1; i < trial.samples.length; i++){
    const dx = trial.samples[i].x - trial.startPos.x;
    const dy = trial.samples[i].y - trial.startPos.y;
    if (Math.hypot(dx, dy) > MOVE_THRESHOLD_PX){
      trial.initTime = trial.samples[i].t;
      break;
    }
  }

  // AUC / MD follow Freeman & Ambady (2010): the ideal trajectory is the
  // straight line from the start position to the CHOSEN option, and
  // deviation toward the unchosen option counts positive.
  const m = computeMetrics(trial.samples, trial.startPos, trial.chosenPos);
  trial.auc        = m.auc;
  trial.md         = m.md;
  trial.xFlips     = m.xFlips;
  trial.normalized = m.normalized;
  trial.mdIdx      = m.mdIdx;

  state.trials.push(trial);
  updatePanels();
  showReview(trial);
}

$('optLeft').addEventListener('click',  e => pickOption('left', e));
$('optRight').addEventListener('click', e => pickOption('right', e));

$('nextBtn').addEventListener('click', () => {
  if (state.stage !== 'review') return;
  setupTrial();
});

function centerOf(el){
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

/* ---------- metrics ----------
   Freeman & Ambady (2010) MouseTracker convention.
   Trajectories are space-rescaled into a normalized space with the start
   at (0,0) and the CHOSEN option at (-1, 1.5) — i.e. every trajectory is
   mirrored so the chosen option is top-left, so the unchosen option
   lies toward +x. The idealized response trajectory is "a straight line
   between each trajectory's start and endpoints" (p. 230) — i.e. from
   (0,0) to the trajectory's actual final sample, NOT the button center.
   MD  = signed maximum perpendicular deviation from the ideal line
         (positive = toward the unchosen option).
   AUC = signed geometric area between actual and ideal trajectory;
         area on the unchosen side counts positive, area on the far
         side counts negative. */

function computeMetrics(samples, startPos, chosenPos){
  const dx = chosenPos.x - startPos.x;
  const dy = startPos.y - chosenPos.y;          // browser y-axis is inverted
  if (dx === 0 || dy === 0 || samples.length < 2){
    return { auc: 0, md: 0, xFlips: 0, normalized: [], mdIdx: 0 };
  }

  // Normalized space: start (0,0), chosen option (-1, 1.5).
  // The x mirror puts the unchosen option on the +x side for every trial.
  const normalizeXY = p => ({
    x: -(p.x - startPos.x) / dx,
    y: ((startPos.y - p.y) / dy) * 1.5,
  });
  const norm = samples.map(p => ({ ...normalizeXY(p), t: p.t }));

  // Ideal line: (0,0) → trajectory endpoint d = (end.x, end.y).
  // For point p:
  //   s(p) = along-line coordinate   = (p · d) / |d|
  //   dev(p) = signed perp deviation = (d.y·p.x − d.x·p.y) / |d|
  //            (positive toward the unchosen option on the +x side)
  const end = norm[norm.length - 1];
  const LEN = Math.hypot(end.x, end.y);
  if (LEN === 0){
    return { auc: 0, md: 0, xFlips: 0,
             normalized: timeNormalize(norm, N_TIME_BINS), mdIdx: 0 };
  }
  const along = p => (p.x * end.x + p.y * end.y) / LEN;
  const dev   = p => (end.y * p.x - end.x * p.y) / LEN;

  // AUC = ∫ dev ds along the ideal line (trapezoidal rule). Segments where
  // the trajectory moves backward along the line contribute with reversed
  // sign, which is exactly the signed-area convention.
  let auc = 0;
  for (let i = 0; i < norm.length - 1; i++){
    auc += 0.5 * (dev(norm[i]) + dev(norm[i + 1]))
               * (along(norm[i + 1]) - along(norm[i]));
  }

  // MD = signed deviation with the largest magnitude
  let md = 0, mdIdx = 0;
  for (let i = 0; i < norm.length; i++){
    const d = dev(norm[i]);
    if (Math.abs(d) > Math.abs(md)){ md = d; mdIdx = i; }
  }

  let xFlips = 0;
  for (let i = 2; i < norm.length; i++){
    const a = norm[i - 1].x - norm[i - 2].x;
    const b = norm[i].x     - norm[i - 1].x;
    if (a * b < 0 && Math.abs(b) > 0.01) xFlips++;
  }

  const tNorm = timeNormalize(norm, N_TIME_BINS);
  return { auc, md, xFlips, normalized: tNorm, mdIdx };
}

function timeNormalize(traj, n){
  if (traj.length < 2) return traj.slice();
  const t0   = traj[0].t;
  const tEnd = traj[traj.length - 1].t;
  const dur  = tEnd - t0;
  if (dur <= 0) return Array.from({length: n}, () => ({...traj[0]}));

  const out = [];
  let j = 0;
  for (let i = 0; i < n; i++){
    const target = t0 + (i / (n - 1)) * dur;
    while (j < traj.length - 1 && traj[j+1].t < target) j++;
    if (j >= traj.length - 1){
      out.push({ ...traj[traj.length - 1] });
    } else {
      const p1 = traj[j], p2 = traj[j+1];
      const span = p2.t - p1.t;
      const f = span > 0 ? (target - p1.t) / span : 0;
      out.push({
        x: p1.x + f * (p2.x - p1.x),
        y: p1.y + f * (p2.y - p1.y),
        t: target,
      });
    }
  }
  return out;
}

/* ---------- review render ---------- */

function showReview(trial){
  state.stage = 'review';
  $('optLeft').classList.add('review');
  $('optRight').classList.add('review');
  $('stimulus').classList.add('hidden');
  $('reviewCanvas').classList.remove('hidden');
  $('reviewBadge').classList.remove('hidden');
  $('reviewMeta').classList.remove('hidden');
  $('nextBtn').classList.remove('hidden');
  $('nextBtn').textContent = state.trials.length >= N_TRIALS ? 'Finish' : 'Next →';

  const meta = $('reviewMeta');
  meta.innerHTML =
    `chose <b>${trial.chosen}</b> (${trial.chosenType})<br>` +
    `AUC <b>${trial.auc.toFixed(3)}</b> · ` +
    `MD <b>${trial.md.toFixed(3)}</b><br>` +
    `x-flips ${trial.xFlips} · RT ${Math.round(trial.rt)} ms<br>` +
    `init ${trial.initTime !== null ? Math.round(trial.initTime) + ' ms' : '—'}` +
    (trial.initTime !== null && trial.initTime > INIT_WARN_MS
      ? ' <span style="color:var(--accent)">(slow)</span>' : '');

  drawReview(trial);
}

function drawReview(trial){
  const canvas = $('reviewCanvas');
  const stage  = $('stage');
  const rect   = stage.getBoundingClientRect();
  const dpr    = window.devicePixelRatio || 1;
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);

  // Convert viewport coords (from stored samples) → stage-local coords.
  // Use the stage rect captured at trial start so trajectory aligns with
  // where the cursor actually was on screen.
  const r0 = trial.stageRect || rect;
  const toLocal = p => ({ x: p.x - r0.left, y: p.y - r0.top });

  const startL  = toLocal(trial.startPos);
  const rightL  = toLocal(trial.rightPos);
  const leftL   = toLocal(trial.leftPos);
  const chosenL = toLocal(trial.chosenPos);

  const endP = trial.samples[trial.samples.length - 1];
  const endL = toLocal(endP);

  // 1) AUC area: ONE closed shape — the trajectory out to its endpoint,
  // then straight back to the start along the ideal line (closePath). A
  // single fill keeps the opacity uniform even where the path
  // self-intersects.
  if (trial.samples.length >= 2){
    ctx.fillStyle = 'rgba(168, 50, 74, 0.14)';
    ctx.beginPath();
    ctx.moveTo(startL.x, startL.y);
    for (const s of trial.samples){
      const p = toLocal(s);
      ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fill();
  }

  // 2) ideal trajectory (dashed): straight line start → trajectory endpoint
  ctx.strokeStyle = 'rgba(31, 30, 44, 0.55)';
  ctx.setLineDash([5, 4]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(startL.x, startL.y);
  ctx.lineTo(endL.x, endL.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // 3) actual trajectory
  ctx.strokeStyle = '#a8324a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(startL.x, startL.y);
  for (const s of trial.samples){
    const p = toLocal(s);
    ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  // 4) endpoint markers
  const dot = (p, fill, r = 4) => {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  };
  const ring = (p, stroke, r = 8) => {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.stroke();
  };
  dot(startL, '#1f1e2c', 4);
  dot(rightL, '#1f1e2c', 4);
  dot(leftL,  '#1f1e2c', 4);
  ring(chosenL, '#a8324a', 8);

  // 5) MD marker — the sample computeMetrics flagged as max deviation,
  // dropped perpendicularly onto the (unclamped) ideal line
  if (trial.mdIdx >= 0 && trial.mdIdx < trial.samples.length){
    const mdIdx = trial.mdIdx;
    const p  = trial.samples[mdIdx];
    const vx = endP.x - trial.startPos.x;
    const vy = endP.y - trial.startPos.y;
    const t  = ((p.x - trial.startPos.x) * vx + (p.y - trial.startPos.y) * vy)
             / (vx * vx + vy * vy);
    const foot = { x: trial.startPos.x + t * vx, y: trial.startPos.y + t * vy };
    const mdL   = toLocal(p);
    const footL = toLocal(foot);
    ctx.strokeStyle = 'rgba(31, 30, 44, 0.7)';
    ctx.setLineDash([2, 3]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mdL.x,   mdL.y);
    ctx.lineTo(footL.x, footL.y);
    ctx.stroke();
    ctx.setLineDash([]);
    dot(mdL, '#a8324a', 3);
  }
}

/* ---------- panels ---------- */

function updatePanels(){
  const last = state.trials[state.trials.length - 1];
  if (!last) return;
  $('lastChoice').textContent = `${last.chosen} · ${last.chosenType}`;
  $('lastAUC').textContent    = last.auc.toFixed(3);
  $('lastMD').textContent     = last.md.toFixed(3);
  $('lastFlips').textContent  = last.xFlips;
  $('lastRT').textContent     = `${Math.round(last.rt)} ms`;
  $('lastInit').textContent   = last.initTime !== null ? `${Math.round(last.initTime)} ms` : '—';

  const n = state.trials.length;
  $('nTrials').textContent = n;
  const mean = arr => arr.reduce((s,v) => s+v, 0) / arr.length;
  $('meanAUC').textContent = mean(state.trials.map(t => t.auc)).toFixed(3);
  $('meanMD').textContent  = mean(state.trials.map(t => t.md)).toFixed(3);
  $('meanRT').textContent  = `${Math.round(mean(state.trials.map(t => t.rt)))} ms`;
}

/* ---------- export ---------- */

$('exportBtn').addEventListener('click', () => {
  if (state.trials.length === 0) return;
  const header = [
    'trial','pair','goal','temptation',
    'left_option','right_option','left_type','right_type',
    'chosen','chosen_type','chosen_side',
    'rt_ms','init_time_ms','auc','md','x_flips',
    'sample_idx','t_norm','x_norm','y_norm'
  ];
  const rows = [header.join(',')];
  state.trials.forEach((t, ti) => {
    t.normalized.forEach((p, si) => {
      rows.push([
        ti + 1, t.pairIdx + 1, q(t.pair.goal.label), q(t.pair.temptation.label),
        q(t.left), q(t.right), t.leftType, t.rightType,
        q(t.chosen), t.chosenType, t.chosenSide,
        Math.round(t.rt), t.initTime !== null ? Math.round(t.initTime) : '',
        t.auc.toFixed(6), t.md.toFixed(6), t.xFlips,
        si, (si / (N_TIME_BINS - 1)).toFixed(4),
        p.x.toFixed(6), p.y.toFixed(6),
      ].join(','));
    });
  });
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `goal-temptation-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

function q(s){ return /[,"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }

/* ---------- reset ---------- */

$('resetBtn').addEventListener('click', () => {
  if (state.trials.length > 0 && !confirm('Clear all recorded trials?')) return;
  startSession();
});

/* ---------- init ---------- */

function startSession(){
  state.trials = [];
  state.order = shuffle(PAIRS.map((_, i) => i));
  // Balanced goal placement: alternating pattern shuffled, so the goal is
  // never on the same side for all trials.
  state.sides = shuffle(PAIRS.map((_, i) => i % 2 === 0));
  ['lastChoice','lastAUC','lastMD','lastFlips','lastRT','lastInit',
   'meanAUC','meanMD','meanRT'].forEach(id => $(id).textContent = '—');
  $('nTrials').textContent = '0';
  setupTrial();
}

startSession();
</script>
