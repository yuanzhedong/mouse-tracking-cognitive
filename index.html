<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouse-tracking</title>
<style>
  :root {
    --bg:     #f4efe4;
    --panel:  #ece5d3;
    --ink:    #1f1e2c;
    --soft:   #7a7587;
    --accent: #a8324a;
    --rule:   #d8cfb6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 10px; margin-bottom: 16px;
    border-bottom: 1px solid var(--ink);
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
  header .trial { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--soft); }
  header .trial b { color: var(--ink); font-weight: 600; }

  main {
    display: grid; grid-template-columns: minmax(0,1fr) 260px;
    gap: 16px; align-items: start;
  }

  .stage {
    position: relative; aspect-ratio: 4/3;
    background: var(--panel); border: 1px solid var(--ink);
    overflow: hidden; user-select: none;
  }

  .option {
    position: absolute; top: 22px;
    padding: 10px 18px;
    background: var(--bg); border: 1px solid var(--ink);
    font-size: 16px; cursor: pointer;
    font-family: inherit;
  }
  .option.opt-left  { left: 22px; }
  .option.opt-right { right: 22px; }
  .option:hover { background: var(--panel); }

  .stimulus {
    position: absolute; top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--soft);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .stage-btn {
    position: absolute; left: 50%; transform: translateX(-50%);
    padding: 10px 26px; border: 1px solid var(--ink);
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; font-family: inherit;
  }
  .start-btn { bottom: 30px; background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .next-btn  { bottom: 20px; background: var(--accent); color: var(--bg); border-color: var(--accent); z-index: 3; }
  .stage-btn:hover { opacity: 0.9; }

  .review-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  .review-meta {
    position: absolute; top: 10px; left: 10px;
    background: rgba(244, 239, 228, 0.92);
    border: 1px solid var(--ink);
    padding: 8px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; line-height: 1.55;
    z-index: 3;
  }
  .review-meta b { color: var(--accent); }

  .hidden { display: none !important; }

  aside { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--bg); border: 1px solid var(--ink);
    padding: 12px 14px;
  }
  .card h3 {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--soft);
    padding-bottom: 6px; margin-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
  dl.metrics {
    display: grid; grid-template-columns: auto 1fr;
    gap: 4px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  dl.metrics dt { color: var(--soft); }
  dl.metrics dd { text-align: right; font-weight: 500; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .controls button {
    padding: 9px 8px; border: 1px solid var(--ink);
    background: var(--bg); cursor: pointer; font-family: inherit;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .controls button.primary { background: var(--ink); color: var(--bg); }
  .controls button:hover { opacity: 0.85; }

  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Mouse-tracking</h1>
    <span class="trial">trial <b id="trialNum">—</b></span>
  </header>

  <main>
    <div class="stage" id="stage">
      <button class="option opt-left hidden"  id="optLeft"></button>
      <button class="option opt-right hidden" id="optRight"></button>
      <div    class="stimulus hidden"         id="stimulus">choose</div>
      <button class="stage-btn start-btn"     id="startBtn">Start</button>
      <canvas class="review-canvas hidden"    id="reviewCanvas"></canvas>
      <div    class="review-meta hidden"      id="reviewMeta"></div>
      <button class="stage-btn next-btn hidden" id="nextBtn">Next →</button>
    </div>

    <aside>
      <div class="card">
        <h3>Last trial</h3>
        <dl class="metrics">
          <dt>chose</dt>   <dd id="lastChoice">—</dd>
          <dt>AUC</dt>     <dd id="lastAUC">—</dd>
          <dt>MD</dt>      <dd id="lastMD">—</dd>
          <dt>x-flips</dt> <dd id="lastFlips">—</dd>
          <dt>RT</dt>      <dd id="lastRT">—</dd>
          <dt>init</dt>    <dd id="lastInit">—</dd>
        </dl>
      </div>

      <div class="card">
        <h3>Aggregate · n=<span id="nTrials">0</span></h3>
        <dl class="metrics">
          <dt>mean AUC</dt> <dd id="meanAUC">—</dd>
          <dt>mean MD</dt>  <dd id="meanMD">—</dd>
          <dt>mean RT</dt>  <dd id="meanRT">—</dd>
        </dl>
      </div>

      <div class="controls">
        <button id="exportBtn" class="primary">Export CSV</button>
        <button id="resetBtn">Reset</button>
      </div>
    </aside>
  </main>
</div>

<script>
/* =============================================================
   MOUSE-TRACKING APPARATUS — debug variant with per-trial review
   AUC & MD after Freeman & Ambady (2010) MouseTracker convention
   ============================================================= */

const STIMULI = [
  { vice: "Brownie",      virtue: "Broccoli" },
  { vice: "Pizza",        virtue: "Salad" },
  { vice: "Donut",        virtue: "Apple" },
  { vice: "Cheeseburger", virtue: "Carrots" },
  { vice: "Ice cream",    virtue: "Yogurt" },
  { vice: "French fries", virtue: "Berries" },
  { vice: "Chocolate",    virtue: "Almonds" },
  { vice: "Cookie",       virtue: "Banana" },
  { vice: "Bacon",        virtue: "Spinach" },
  { vice: "Milkshake",    virtue: "Water" },
];

const INIT_WARN_MS = 500;
const MOVE_THRESHOLD_PX = 10;
const N_TIME_BINS = 101;

const $ = id => document.getElementById(id);

const state = {
  pool: [],
  trials: [],
  current: null,
  stage: 'idle',   // idle | awaiting_start | in_trial | review
};

/* ---------- setup ---------- */

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function nextStimulus(){
  if (state.pool.length === 0) state.pool = shuffle(STIMULI);
  return state.pool.pop();
}

function setupTrial(){
  const pair = nextStimulus();
  const leftIsVirtue = Math.random() < 0.5;
  state.current = {
    left:      leftIsVirtue ? pair.virtue : pair.vice,
    right:     leftIsVirtue ? pair.vice  : pair.virtue,
    leftType:  leftIsVirtue ? 'virtue'   : 'vice',
    rightType: leftIsVirtue ? 'vice'     : 'virtue',
    pair,
    samples: [],
  };
  $('optLeft').textContent  = state.current.left;
  $('optRight').textContent = state.current.right;
  $('optLeft').classList.add('hidden');
  $('optRight').classList.add('hidden');
  $('stimulus').classList.add('hidden');
  $('startBtn').classList.remove('hidden');
  $('reviewCanvas').classList.add('hidden');
  $('reviewMeta').classList.add('hidden');
  $('nextBtn').classList.add('hidden');
  $('trialNum').textContent = state.trials.length + 1;
  state.stage = 'awaiting_start';
}

/* ---------- trial flow ---------- */

$('startBtn').addEventListener('click', e => {
  if (state.stage !== 'awaiting_start') return;
  const c = state.current;
  c.stageRect = $('stage').getBoundingClientRect();
  c.startPos  = { x: e.clientX, y: e.clientY };
  c.startTime = performance.now();
  c.samples.push({ x: e.clientX, y: e.clientY, t: 0 });

  $('startBtn').classList.add('hidden');
  $('optLeft').classList.remove('hidden');
  $('optRight').classList.remove('hidden');
  $('stimulus').classList.remove('hidden');
  state.stage = 'in_trial';
});

document.addEventListener('mousemove', e => {
  if (state.stage !== 'in_trial') return;
  const t = performance.now() - state.current.startTime;
  state.current.samples.push({ x: e.clientX, y: e.clientY, t });
});

function pickOption(side){
  if (state.stage !== 'in_trial') return;
  const trial = state.current;
  trial.rt = performance.now() - trial.startTime;

  const chosenEl  = side === 'left' ? $('optLeft')  : $('optRight');
  const otherEl   = side === 'left' ? $('optRight') : $('optLeft');
  trial.chosen     = side === 'left' ? trial.left      : trial.right;
  trial.chosenType = side === 'left' ? trial.leftType  : trial.rightType;
  trial.chosenSide = side;
  trial.chosenPos  = centerOf(chosenEl);
  trial.otherPos   = centerOf(otherEl);

  trial.initTime = null;
  for (let i = 1; i < trial.samples.length; i++){
    const dx = trial.samples[i].x - trial.startPos.x;
    const dy = trial.samples[i].y - trial.startPos.y;
    if (Math.hypot(dx, dy) > MOVE_THRESHOLD_PX){
      trial.initTime = trial.samples[i].t;
      break;
    }
  }

  const m = computeMetrics(trial.samples, trial.startPos, trial.chosenPos);
  trial.auc        = m.auc;
  trial.md         = m.md;
  trial.xFlips     = m.xFlips;
  trial.normalized = m.normalized;

  state.trials.push(trial);
  updatePanels();
  showReview(trial);
}

$('optLeft').addEventListener('click',  () => pickOption('left'));
$('optRight').addEventListener('click', () => pickOption('right'));

$('nextBtn').addEventListener('click', () => {
  if (state.stage !== 'review') return;
  setupTrial();
});

function centerOf(el){
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

/* ---------- metrics ----------
   AUC and MD are unsigned: the area / max distance between the actual
   cursor path and the ideal straight line from start to chosen target,
   in normalized (0,0)→(1,1.5) coordinates. No mirroring; direction of
   deviation doesn't matter. */

function computeMetrics(samples, startPos, chosenPos){
  const dx = chosenPos.x - startPos.x;
  const dy = startPos.y - chosenPos.y;          // browser y-axis is inverted
  if (dx === 0 || dy === 0 || samples.length < 2){
    return { auc: 0, md: 0, xFlips: 0, normalized: [] };
  }

  // Translate to start; scale x by signed dx and y by dy so the chosen
  // target lands at (1, 1.5) regardless of which side it was on.
  const normalized = samples.map(p => ({
    x: (p.x - startPos.x) / dx,
    y: ((startPos.y - p.y) / dy) * 1.5,
    t: p.t,
  }));

  let xFlips = 0;
  for (let i = 2; i < normalized.length; i++){
    const a = normalized[i-1].x - normalized[i-2].x;
    const b = normalized[i].x   - normalized[i-1].x;
    if (a * b < 0 && Math.abs(b) > 0.01) xFlips++;
  }

  const tNorm = timeNormalize(normalized, N_TIME_BINS);

  // ideal line from (0,0) to (1, 1.5); unit tangent & normal
  const L = Math.sqrt(1 + 2.25);
  const ux =  1   / L, uy = 1.5 / L;
  const nx = -uy,      ny = ux;

  const proj = tNorm.map(p => ({
    s: p.x * ux + p.y * uy,           // distance along ideal line
    d: p.x * nx + p.y * ny,           // perpendicular distance (signed)
  }));

  // AUC = ∫ |d| ds  (unsigned swept area between path and ideal line)
  let auc = 0;
  for (let i = 0; i < proj.length - 1; i++){
    const ds  = Math.abs(proj[i+1].s - proj[i].s);
    const avg = (Math.abs(proj[i].d) + Math.abs(proj[i+1].d)) / 2;
    auc += avg * ds;
  }
  // MD = max |perpendicular distance|
  let md = 0;
  for (const p of proj) if (Math.abs(p.d) > md) md = Math.abs(p.d);

  return { auc, md, xFlips, normalized: tNorm };
}

function timeNormalize(traj, n){
  if (traj.length < 2) return traj.slice();
  const t0   = traj[0].t;
  const tEnd = traj[traj.length - 1].t;
  const dur  = tEnd - t0;
  if (dur <= 0) return Array.from({length: n}, () => ({...traj[0]}));

  const out = [];
  let j = 0;
  for (let i = 0; i < n; i++){
    const target = t0 + (i / (n - 1)) * dur;
    while (j < traj.length - 1 && traj[j+1].t < target) j++;
    if (j >= traj.length - 1){
      out.push({ ...traj[traj.length - 1] });
    } else {
      const p1 = traj[j], p2 = traj[j+1];
      const span = p2.t - p1.t;
      const f = span > 0 ? (target - p1.t) / span : 0;
      out.push({
        x: p1.x + f * (p2.x - p1.x),
        y: p1.y + f * (p2.y - p1.y),
        t: target,
      });
    }
  }
  return out;
}

/* ---------- review render ---------- */

function showReview(trial){
  state.stage = 'review';
  $('optLeft').classList.add('hidden');
  $('optRight').classList.add('hidden');
  $('stimulus').classList.add('hidden');
  $('reviewCanvas').classList.remove('hidden');
  $('reviewMeta').classList.remove('hidden');
  $('nextBtn').classList.remove('hidden');

  const meta = $('reviewMeta');
  meta.innerHTML =
    `chose <b>${trial.chosen}</b> (${trial.chosenType})<br>` +
    `AUC <b>${trial.auc.toFixed(3)}</b> · ` +
    `MD <b>${trial.md.toFixed(3)}</b><br>` +
    `x-flips ${trial.xFlips} · RT ${Math.round(trial.rt)} ms<br>` +
    `init ${trial.initTime !== null ? Math.round(trial.initTime) + ' ms' : '—'}` +
    (trial.initTime !== null && trial.initTime > INIT_WARN_MS
      ? ' <span style="color:var(--accent)">(slow)</span>' : '');

  drawReview(trial);
}

function drawReview(trial){
  const canvas = $('reviewCanvas');
  const stage  = $('stage');
  const rect   = stage.getBoundingClientRect();
  const dpr    = window.devicePixelRatio || 1;
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);

  // Convert viewport coords (from stored samples) → stage-local coords.
  // Use the stage rect captured at trial start so trajectory aligns with
  // where the cursor actually was on screen.
  const r0 = trial.stageRect || rect;
  const toLocal = p => ({ x: p.x - r0.left, y: p.y - r0.top });

  const start  = toLocal(trial.startPos);
  const chosen = toLocal(trial.chosenPos);
  const other  = toLocal(trial.otherPos);

  // 1) AUC area: ribbon of trapezoids between each segment of the actual path
  // and its perpendicular projection onto the ideal line. Drawing it
  // segment-by-segment (instead of one closed polygon) ensures both sides of
  // the line are shaded when the trajectory crosses it.
  if (trial.samples.length >= 2){
    const sVec  = { x: trial.chosenPos.x - trial.startPos.x,
                    y: trial.chosenPos.y - trial.startPos.y };
    const sLen2 = sVec.x * sVec.x + sVec.y * sVec.y;
    const footOf = p => {
      const vx = p.x - trial.startPos.x;
      const vy = p.y - trial.startPos.y;
      const t  = (vx * sVec.x + vy * sVec.y) / sLen2;
      return { x: trial.startPos.x + t * sVec.x,
               y: trial.startPos.y + t * sVec.y };
    };
    ctx.fillStyle = 'rgba(168, 50, 74, 0.14)';
    for (let i = 0; i < trial.samples.length - 1; i++){
      const a  = toLocal(trial.samples[i]);
      const b  = toLocal(trial.samples[i + 1]);
      const fa = toLocal(footOf(trial.samples[i]));
      const fb = toLocal(footOf(trial.samples[i + 1]));
      ctx.beginPath();
      ctx.moveTo(a.x,  a.y);
      ctx.lineTo(b.x,  b.y);
      ctx.lineTo(fb.x, fb.y);
      ctx.lineTo(fa.x, fa.y);
      ctx.closePath();
      ctx.fill();
    }
  }

  // 2) ideal straight line
  ctx.strokeStyle = 'rgba(31, 30, 44, 0.55)';
  ctx.setLineDash([5, 4]);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(start.x, start.y);
  ctx.lineTo(chosen.x, chosen.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // 3) actual trajectory
  ctx.strokeStyle = 'var(--accent)';
  ctx.strokeStyle = '#a8324a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(start.x, start.y);
  for (const s of trial.samples){
    const p = toLocal(s);
    ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  // 4) endpoint markers
  const dot = (p, fill, r = 5) => {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  };
  dot(start,  '#1f1e2c', 4);
  dot(chosen, '#1f1e2c', 5);
  dot(other,  '#bdb7a4', 4);

  // 5) MD marker — find the time-normalized sample with max |perp dist|
  if (trial.normalized && trial.normalized.length > 0){
    const dx = trial.chosenPos.x - trial.startPos.x;
    const dy = trial.startPos.y - trial.chosenPos.y;
    const L  = Math.sqrt(1 + 2.25);
    const ux =  1   / L, uy = 1.5 / L;
    const nx = -uy,      ny = ux;

    let mdIdx = 0, mdVal = 0;
    for (let i = 0; i < trial.normalized.length; i++){
      const p = trial.normalized[i];
      const d = Math.abs(p.x * nx + p.y * ny);
      if (d > mdVal) { mdVal = d; mdIdx = i; }
    }
    const mdNorm = trial.normalized[mdIdx];
    // invert normalization → viewport → local
    const mdView = {
      x: trial.startPos.x + mdNorm.x * dx,
      y: trial.startPos.y - (mdNorm.y / 1.5) * dy,
    };
    const mdL = toLocal(mdView);
    // perpendicular foot on the ideal line (in viewport space)
    const sVec = { x: trial.chosenPos.x - trial.startPos.x,
                   y: trial.chosenPos.y - trial.startPos.y };
    const sLen2 = sVec.x*sVec.x + sVec.y*sVec.y;
    const v = { x: mdView.x - trial.startPos.x, y: mdView.y - trial.startPos.y };
    const tProj = (v.x*sVec.x + v.y*sVec.y) / sLen2;
    const footView = {
      x: trial.startPos.x + tProj * sVec.x,
      y: trial.startPos.y + tProj * sVec.y,
    };
    const footL = toLocal(footView);

    ctx.strokeStyle = 'rgba(31, 30, 44, 0.7)';
    ctx.setLineDash([2, 3]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mdL.x,  mdL.y);
    ctx.lineTo(footL.x, footL.y);
    ctx.stroke();
    ctx.setLineDash([]);
    dot(mdL, '#a8324a', 3);
  }
}

/* ---------- panels ---------- */

function updatePanels(){
  const last = state.trials[state.trials.length - 1];
  if (!last) return;
  $('lastChoice').textContent = `${last.chosen} · ${last.chosenType}`;
  $('lastAUC').textContent    = last.auc.toFixed(3);
  $('lastMD').textContent     = last.md.toFixed(3);
  $('lastFlips').textContent  = last.xFlips;
  $('lastRT').textContent     = `${Math.round(last.rt)} ms`;
  $('lastInit').textContent   = last.initTime !== null ? `${Math.round(last.initTime)} ms` : '—';

  const n = state.trials.length;
  $('nTrials').textContent = n;
  const mean = arr => arr.reduce((s,v) => s+v, 0) / arr.length;
  $('meanAUC').textContent = mean(state.trials.map(t => t.auc)).toFixed(3);
  $('meanMD').textContent  = mean(state.trials.map(t => t.md)).toFixed(3);
  $('meanRT').textContent  = `${Math.round(mean(state.trials.map(t => t.rt)))} ms`;
}

/* ---------- export ---------- */

$('exportBtn').addEventListener('click', () => {
  if (state.trials.length === 0) return;
  const header = [
    'trial','left_option','right_option','left_type','right_type',
    'chosen','chosen_type','chosen_side',
    'rt_ms','init_time_ms','auc','md','x_flips',
    'sample_idx','t_norm','x_norm','y_norm'
  ];
  const rows = [header.join(',')];
  state.trials.forEach((t, ti) => {
    t.normalized.forEach((p, si) => {
      rows.push([
        ti + 1, q(t.left), q(t.right), t.leftType, t.rightType,
        q(t.chosen), t.chosenType, t.chosenSide,
        Math.round(t.rt), t.initTime !== null ? Math.round(t.initTime) : '',
        t.auc.toFixed(6), t.md.toFixed(6), t.xFlips,
        si, (si / (N_TIME_BINS - 1)).toFixed(4),
        p.x.toFixed(6), p.y.toFixed(6),
      ].join(','));
    });
  });
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mouse-tracking-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

function q(s){ return /[,"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }

/* ---------- reset ---------- */

$('resetBtn').addEventListener('click', () => {
  if (state.trials.length > 0 && !confirm('Clear all recorded trials?')) return;
  state.trials = [];
  state.pool = [];
  ['lastChoice','lastAUC','lastMD','lastFlips','lastRT','lastInit',
   'meanAUC','meanMD','meanRT'].forEach(id => $(id).textContent = '—');
  $('nTrials').textContent = '0';
  setupTrial();
});
